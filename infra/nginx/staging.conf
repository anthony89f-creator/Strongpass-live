# Nginx config for staging.strongpass.live
# Place at: /etc/nginx/sites-available/strongpass-staging
# Enable:   ln -s /etc/nginx/sites-available/strongpass-staging /etc/nginx/sites-enabled/
#
# DNS prerequisite: add A record  staging.strongpass.live → same IP as strongpass.live
# SSL:  certbot --nginx -d staging.strongpass.live --email your@email.com --agree-tos -n

server {
    listen 80;
    server_name staging.strongpass.live;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.strongpass.live;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/staging.strongpass.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.strongpass.live/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (relaxed for staging — allow any frame origin for OBS testing)
    add_header X-Content-Type-Options "nosniff" always;

    # SSE: disable buffering so events arrive immediately
    location /stream {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }
}
