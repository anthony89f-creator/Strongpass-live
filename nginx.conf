# Nginx reverse proxy for strongpass.live
# Place at: /etc/nginx/sites-available/strongpass
# Enable: ln -s /etc/nginx/sites-available/strongpass /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name strongpass.live www.strongpass.live;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name strongpass.live www.strongpass.live;

    # SSL — managed by Certbot (run: certbot --nginx -d strongpass.live -d www.strongpass.live)
    ssl_certificate     /etc/letsencrypt/live/strongpass.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strongpass.live/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- SSE stream: disable buffering so events arrive immediately ---
    location /stream {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;   # keep SSE connections alive for 1 hour
        chunked_transfer_encoding on;
    }

    # --- All other routes ---
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Cache static assets (overlays, CSS, JS)
    location ~* \.(css|js|png|jpg|svg|ico|woff|woff2)$ {
        proxy_pass http://127.0.0.1:8080;
        add_header Cache-Control "public, max-age=3600";
    }
}
