<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Category Lineup</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; font-family:'Barlow Condensed',sans-serif; width:1920px; height:1080px; overflow:hidden; }
  :root {
    --bg:   rgba(5,5,5,0.97);
    --gold: #F5C842;
    --dim:  #666;
    --text: #F0F0F0;
  }

  #lineup {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.4s ease;
  }
  #lineup.visible { opacity:1; }

  /* Full bg */
  .bg-fill {
    position:absolute; inset:0;
    background:var(--bg);
  }

  /* Animated noise texture */
  .bg-texture {
    position:absolute; inset:0; opacity:0.03;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  }

  /* Horizontal lines */
  .scan-lines {
    position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, transparent 0px, transparent 5px, rgba(255,255,255,0.008) 5px, rgba(255,255,255,0.008) 6px);
  }

  /* Gold accent lines */
  .accent-line-top {
    position:absolute; top:80px; left:120px; right:120px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(245,200,66,0.4), transparent);
    transform:scaleX(0);
    transition:transform 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s;
  }
  .accent-line-bot {
    position:absolute; bottom:80px; left:120px; right:120px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(245,200,66,0.4), transparent);
    transform:scaleX(0);
    transition:transform 0.8s cubic-bezier(0.16,1,0.3,1) 0.3s;
  }
  #lineup.visible .accent-line-top,
  #lineup.visible .accent-line-bot { transform:scaleX(1); }

  /* Content */
  .content {
    position:relative; z-index:2; text-align:center;
    opacity:0; transform:translateY(30px);
    transition:opacity 0.6s ease 0.35s, transform 0.6s cubic-bezier(0.16,1,0.3,1) 0.35s;
  }
  #lineup.visible .content { opacity:1; transform:translateY(0); }

  .comp-name {
    font-size:14px; font-weight:700; letter-spacing:0.4em;
    text-transform:uppercase; color:var(--dim);
    font-family:'Barlow',sans-serif; margin-bottom:24px;
  }

  /* Category dot */
  .cat-dot-wrap { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:16px; }
  .cat-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .cat-dot-line { height:1px; width:60px; background:rgba(255,255,255,0.1); }

  /* Main category name */
  .cat-name {
    font-size:130px; font-weight:900; letter-spacing:0.03em;
    text-transform:uppercase; line-height:0.88; color:#fff;
    text-shadow:0 8px 60px rgba(0,0,0,0.8);
  }

  /* Athlete count */
  .cat-count-row {
    display:flex; align-items:center; justify-content:center; gap:20px; margin-top:28px;
  }
  .cat-count-line { height:1px; width:80px; background:rgba(255,255,255,0.1); }
  .cat-count {
    font-size:18px; font-weight:700; letter-spacing:0.22em;
    text-transform:uppercase; color:rgba(255,255,255,0.45);
    font-family:'Barlow',sans-serif;
  }
  .cat-count span { color:var(--gold); font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:900; }

  /* Top athletes preview */
  .athletes-row {
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:32px; flex-wrap:wrap;
  }
  .ath-chip {
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
    border-radius:3px; padding:5px 14px;
    font-size:14px; font-weight:700; letter-spacing:0.08em;
    text-transform:uppercase; color:rgba(255,255,255,0.5);
  }
  .ath-chip.first { color:var(--gold); border-color:rgba(245,200,66,0.2); background:rgba(245,200,66,0.05); }

  /* Navigation dots */
  .nav-dots {
    position:absolute; bottom:50px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:8px; z-index:3;
  }
  .nav-dot {
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,0.15); transition:all 0.3s ease;
  }
  .nav-dot.active { background:var(--gold); transform:scale(1.3); }

  /* Progress bar */
  .progress-bar {
    position:absolute; bottom:0; left:0; height:2px; background:var(--gold);
    transition:width 0s linear;
  }

  /* Corner labels */
  .corner-tl, .corner-tr {
    position:absolute; top:40px; font-size:10px; font-weight:700;
    letter-spacing:0.25em; text-transform:uppercase; color:var(--dim);
    font-family:'Barlow',sans-serif; z-index:3;
  }
  .corner-tl { left:60px; }
  .corner-tr { right:60px; text-align:right; }
</style>
</head>
<body>

<div id="lineup">
  <div class="bg-fill"></div>
  <div class="bg-texture"></div>
  <div class="scan-lines"></div>
  <div class="accent-line-top"></div>
  <div class="accent-line-bot"></div>

  <div class="corner-tl" id="corner-comp">IRON CHALLENGE 2025</div>
  <div class="corner-tr" id="corner-event">WEIGHT CATEGORIES</div>

  <div class="content">
    <div class="comp-name" id="disp-comp">IRON CHALLENGE 2025</div>
    <div class="cat-dot-wrap">
      <div class="cat-dot-line"></div>
      <div class="cat-dot" id="disp-dot" style="background:#F5C842"></div>
      <div class="cat-dot-line"></div>
    </div>
    <div class="cat-name" id="disp-name">OPEN</div>
    <div class="cat-count-row">
      <div class="cat-count-line"></div>
      <div class="cat-count"><span id="disp-count">0</span> Athletes Competing</div>
      <div class="cat-count-line"></div>
    </div>
    <div class="athletes-row" id="disp-athletes"></div>
  </div>

  <div class="nav-dots" id="nav-dots"></div>
  <div class="progress-bar" id="progress-bar"></div>
</div>

<script src="sse-client.js"></script>
<script>
let state = {
  lineup: false,
  lineupAuto: true,
  lineupDuration: 5,       // seconds per category
  lineupIndex: 0,
  categories: [],
  athletes: [],
  compName: 'IRON CHALLENGE 2025',
  eventName: 'WEIGHT CATEGORIES'
};

let autoTimer = null;
let progressTimer = null;
let currentIndex = 0;
let isVisible = false;

function getCategoryData() {
  // Build category list from athletes
  const catNames = state.categories && state.categories.length
    ? state.categories.map(c => ({ name: c.name, color: c.color }))
    : [...new Set((state.athletes||[]).map(a=>a.category||'').filter(Boolean))].map(c=>({ name:c, color:'#F5C842' }));

  return catNames.map(cat => {
    const athletes = (state.athletes||[]).filter(a => (a.category||'') === cat.name);
    athletes.sort((a,b) => parseFloat(b.score||0) - parseFloat(a.score||0));
    return { ...cat, count: athletes.length, athletes: athletes.slice(0,6) };
  }).filter(c => c.count > 0);
}

function showCategory(index) {
  const cats = getCategoryData();
  if (!cats.length) return;
  currentIndex = ((index % cats.length) + cats.length) % cats.length;
  const cat = cats[currentIndex];

  // Update content
  document.getElementById('disp-comp').textContent  = state.compName || '';
  document.getElementById('disp-name').textContent  = cat.name;
  document.getElementById('disp-dot').style.background = cat.color || '#F5C842';
  document.getElementById('disp-count').textContent = cat.count;
  document.getElementById('corner-comp').textContent  = state.compName || '';
  document.getElementById('corner-event').textContent = 'WEIGHT CATEGORIES';

  // Athletes chips
  document.getElementById('disp-athletes').innerHTML = cat.athletes.map((a,i) =>
    `<div class="ath-chip${i===0?' first':''}">${a.name}</div>`
  ).join('');

  // Nav dots
  document.getElementById('nav-dots').innerHTML = cats.map((_,i) =>
    `<div class="nav-dot${i===currentIndex?' active':''}"></div>`
  ).join('');

  // Animate content refresh
  const content = document.querySelector('.content');
  content.style.opacity = '0';
  content.style.transform = 'translateY(20px)';
  setTimeout(() => {
    content.style.transition = 'opacity 0.5s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1)';
    content.style.opacity = '1';
    content.style.transform = 'translateY(0)';
  }, 50);

  // Progress bar
  clearTimeout(progressTimer);
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  if (state.lineupAuto !== false) {
    const dur = (state.lineupDuration || 5) * 1000;
    setTimeout(() => {
      bar.style.transition = `width ${dur}ms linear`;
      bar.style.width = '100%';
    }, 50);
  }
}

function startAuto() {
  clearInterval(autoTimer);
  if (state.lineupAuto === false) return;
  const dur = (state.lineupDuration || 5) * 1000;
  autoTimer = setInterval(() => {
    const cats = getCategoryData();
    if (cats.length > 1) showCategory(currentIndex + 1);
  }, dur);
}

function stopAuto() {
  clearInterval(autoTimer);
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
}

function render() {
  const el = document.getElementById('lineup');
  const want = !!state.lineup;

  if (want && !isVisible) {
    isVisible = true;
    el.classList.add('visible');
    currentIndex = state.lineupIndex || 0;
    showCategory(currentIndex);
    startAuto();
  } else if (!want && isVisible) {
    isVisible = false;
    el.classList.remove('visible');
    stopAuto();
  } else if (want && isVisible) {
    // Update content if state changed
    showCategory(state.lineupIndex !== undefined ? state.lineupIndex : currentIndex);
  }
}

window.onStateUpdate = function(d) {
  const prevIndex = state.lineupIndex;
  Object.assign(state, d);
  if (state.lineup && d.lineupIndex !== undefined && d.lineupIndex !== prevIndex) {
    showCategory(d.lineupIndex);
  } else {
    render();
  }
};

</script>
</body>
</html>
