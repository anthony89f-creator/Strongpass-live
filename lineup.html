<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Category Lineup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; font-family:'Barlow Condensed',sans-serif; width:1920px; height:1080px; overflow:hidden; }

  #lineup {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.35s ease;
  }
  #lineup.visible { opacity:1; }

  /* ── BACKGROUND ─────────────────────────────────────── */
  .bg-fill {
    position:absolute; inset:0;
    background:#090909;
  }

  /* Precision grid — engineering paper, barely visible */
  .bg-grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.016) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.016) 1px, transparent 1px);
    background-size:80px 80px;
  }

  /* Ruled horizontal lines — mechanical reveal on show */
  .rule-h {
    position:absolute; left:100px; right:100px; height:1px;
    background:rgba(255,255,255,0.1);
    transform:scaleX(0);
  }
  .rule-h.top {
    top:72px;
    transform-origin:left center;
    transition:transform 0.55s cubic-bezier(0.4,0,0.2,1) 0.1s;
  }
  .rule-h.bottom {
    bottom:72px;
    transform-origin:right center;
    transition:transform 0.55s cubic-bezier(0.4,0,0.2,1) 0.22s;
  }
  #lineup.visible .rule-h { transform:scaleX(1); }

  /* Corner labels */
  .corner-tl, .corner-tr {
    position:absolute; top:36px; z-index:3;
    font-size:11px; font-weight:700; letter-spacing:0.3em;
    text-transform:uppercase; color:rgba(255,255,255,0.28);
    font-family:'Barlow',sans-serif;
  }
  .corner-tl { left:100px; }
  .corner-tr { right:100px; text-align:right; }

  /* ── CONTENT BLOCK ───────────────────────────────────── */
  .content {
    position:relative; z-index:2;
    width:1100px;
    opacity:0;
    /* opacity managed via inline styles in showCategory() */
  }

  /* Category header */
  .cat-header { margin-bottom:32px; }

  /* Category color accent — disciplined 3px strip */
  .cat-accent {
    width:40px; height:3px;
    margin-bottom:20px;
    /* background set via inline style */
  }

  /* Eyebrow label */
  .cat-eyebrow {
    display:block;
    font-size:11px; font-weight:700; letter-spacing:0.36em;
    text-transform:uppercase; color:rgba(255,255,255,0.28);
    font-family:'Barlow',sans-serif;
    margin-bottom:10px;
  }

  /* Category name — the hero */
  .cat-name {
    font-size:94px; font-weight:900; letter-spacing:0.01em;
    text-transform:uppercase; line-height:0.88; color:#F0F0F0;
  }

  /* Horizontal separator */
  .cat-divider {
    height:1px; background:rgba(255,255,255,0.08);
    margin:28px 0 0;
  }

  /* ── ATHLETE LIST ─────────────────────────────────────── */
  .athlete-list {
    border-left:3px solid #F5C842; /* overridden inline per category color */
    padding-left:28px;
  }

  .ath-row {
    display:grid;
    grid-template-columns:60px 1fr auto;
    align-items:center;
    height:56px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    opacity:0;
    transform:translateX(-8px);
    transition:opacity 0.16s ease, transform 0.16s ease;
  }
  .ath-row.in { opacity:1; transform:translateX(0); }

  /* Rank — dim by default, accented for top 3 */
  .ath-rank {
    font-size:24px; font-weight:900;
    color:rgba(255,255,255,0.16);
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .ath-row[data-rank="1"] .ath-rank { color:rgba(245,200,66,0.55); }
  .ath-row[data-rank="2"] .ath-rank { color:rgba(255,255,255,0.32); }
  .ath-row[data-rank="3"] .ath-rank { color:rgba(255,255,255,0.24); }

  /* Athlete name — broadcast-readable at distance */
  .ath-name {
    font-size:38px; font-weight:800; letter-spacing:0.025em;
    text-transform:uppercase; color:#F0F0F0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    line-height:1;
  }

  /* Origin / nationality */
  .ath-origin {
    font-size:14px; font-weight:700; letter-spacing:0.22em;
    text-transform:uppercase; color:rgba(255,255,255,0.26);
    font-family:'Barlow',sans-serif;
    padding-left:20px;
    white-space:nowrap;
  }

  /* Overflow indicator */
  .ath-overflow {
    font-size:12px; font-weight:700; letter-spacing:0.24em;
    text-transform:uppercase; color:rgba(255,255,255,0.18);
    font-family:'Barlow',sans-serif;
    padding-top:14px;
    padding-left:60px;
  }

  /* ── NAVIGATION — F1 segment bar ─────────────────────── */
  .nav-strip {
    position:absolute; bottom:84px; left:100px; right:100px;
    display:flex; align-items:center; gap:3px; z-index:3;
    height:2px;
  }
  .nav-seg {
    flex:1; height:2px;
    background:rgba(255,255,255,0.1);
    transition:background 0.3s ease;
  }
  .nav-seg.active { background:rgba(255,255,255,0.62); }

  /* Progress bar — gold, razor thin */
  .progress-bar {
    position:absolute; bottom:0; left:0; height:2px;
    background:#F5C842;
    transition:width 0s linear;
  }
</style>
</head>
<body>

<div id="lineup">
  <div class="bg-fill"></div>
  <div class="bg-grid"></div>
  <div class="rule-h top"></div>
  <div class="rule-h bottom"></div>

  <div class="corner-tl" id="corner-comp"></div>
  <div class="corner-tr" id="corner-event"></div>

  <div class="content">
    <div class="cat-header">
      <div class="cat-accent" id="cat-accent"></div>
      <span class="cat-eyebrow" id="cat-eyebrow">Weight Category</span>
      <div class="cat-name" id="disp-name">OPEN</div>
    </div>
    <div class="cat-divider"></div>
    <div class="athlete-list" id="disp-athletes"></div>
  </div>

  <div class="nav-strip" id="nav-strip"></div>
  <div class="progress-bar" id="progress-bar"></div>
</div>

<script>
window.PVW_MODE = /[?&]pvw=1/.test(location.search);

if (window.PVW_MODE) {
  window.DISABLE_SSE = true;
  var _pvwReady = false;
  var _PVW_NAME = 'lineup';

  window.addEventListener('message', function(e) {
    try {
      if (typeof window.onStateUpdate === 'function') {
        var keys = e.data ? Object.keys(e.data) : [];
        console.log('[' + _PVW_NAME + '] onStateUpdate received — ' + keys.length + ' keys');
        console.log('[' + _PVW_NAME + '] payload sample: ' + JSON.stringify(e.data).slice(0, 200));

        console.log('[' + _PVW_NAME + '] render begin');
        window.onStateUpdate(e.data);
        console.log('[' + _PVW_NAME + '] render end');

        (function() {
          var root = document.body;
          if (!root) { console.log('[' + _PVW_NAME + '] WARNING: document.body null'); return; }
          var rect = root.getBoundingClientRect();
          var cs   = window.getComputedStyle(root);
          console.log('[' + _PVW_NAME + '] root rect=' + Math.round(rect.width) + 'x' + Math.round(rect.height) +
                      ' visibility=' + cs.visibility + ' display=' + cs.display + ' opacity=' + cs.opacity);
          var first = root.firstElementChild;
          if (first) {
            var fr = first.getBoundingClientRect();
            console.log('[' + _PVW_NAME + '] first-child=' + first.tagName + (first.id ? '#'+first.id : '') +
                        ' rect=' + Math.round(fr.width) + 'x' + Math.round(fr.height) +
                        ' visibility=' + window.getComputedStyle(first).visibility);
          } else {
            console.log('[' + _PVW_NAME + '] WARNING: no first child in body');
          }
        }());

        if (!_pvwReady) {
          _pvwReady = true;
          requestAnimationFrame(function() {
            console.log('[' + _PVW_NAME + '] overlay-ready emitted (post-rAF paint)');
            window.parent.postMessage({ type: 'overlay-ready' }, '*');
          });
        }
      }
    } catch (err) {
      console.error('[' + _PVW_NAME + '] postMessage error:', err);
    }
  });
}
</script>
<script src="sse-client.js"></script>
<script>
let state = {
  lineup:         false,
  lineupAuto:     true,
  lineupDuration: 5,
  lineupIndex:    0,
  categories:     [],
  athletes:       [],
  compName:       '',
  eventName:      'WEIGHT CATEGORIES'
};

let autoTimer    = null;
let progressTimer = null;
let currentIndex  = 0;
let isVisible     = false;

// Hash of the currently displayed category's data. showCategory() triggers a
// fade-out/fade-in + stagger — only call it when displayed content actually changes.
var _lastCatKey = null;

function _catKey() {
  const cats = getCategoryData();
  if (!cats.length) return 'empty|' + (state.compName||'');
  const ci  = ((currentIndex % cats.length) + cats.length) % cats.length;
  const cat = cats[ci];
  return (state.compName||'') + '|' + ci + '|' + cat.name + '|' + cat.count + '|' +
    cat.athletes.slice(0,8).map(a => a.name + ':' + (a.score||'')).join(',');
}

function getCategoryData() {
  const catNames = state.categories && state.categories.length
    ? state.categories.map(c => ({ name: c.name, color: c.color }))
    : [...new Set((state.athletes||[]).map(a=>a.category||'').filter(Boolean))].map(c=>({ name:c, color:'#F5C842' }));

  // lbStandings contains all categories' athletes (state.athletes is single-category in PVW mode).
  if (state.lbStandings) {
    return catNames.map(cat => {
      const athletes = state.lbStandings[cat.name] || [];
      return { ...cat, count: athletes.length, athletes };
    }).filter(c => c.count > 0);
  }

  return catNames.map(cat => {
    const athletes = (state.athletes||[]).filter(a => (a.category||'') === cat.name);
    athletes.sort((a,b) => parseFloat(b.score||0) - parseFloat(a.score||0));
    return { ...cat, count: athletes.length, athletes };
  }).filter(c => c.count > 0);
}

function showCategory(index) {
  const cats = getCategoryData();
  if (!cats.length) return;
  currentIndex = ((index % cats.length) + cats.length) % cats.length;
  const cat    = cats[currentIndex];

  // Corner labels
  document.getElementById('corner-comp').textContent  = state.compName || '';
  document.getElementById('corner-event').textContent = state.eventName || 'WEIGHT CATEGORIES';

  // Category header
  const accentEl = document.getElementById('cat-accent');
  accentEl.style.background = cat.color || '#F5C842';
  document.getElementById('cat-eyebrow').textContent = 'Weight Category';
  document.getElementById('disp-name').textContent   = cat.name;

  // Athlete list — up to 8 rows, overflow note if more
  const listEl   = document.getElementById('disp-athletes');
  const shown    = cat.athletes.slice(0, 8);
  const overflow = cat.count - shown.length;
  listEl.style.borderLeftColor = cat.color || '#F5C842';
  listEl.innerHTML = shown.map((a, i) =>
    `<div class="ath-row" data-rank="${i+1}">` +
      `<span class="ath-rank">${i+1}</span>` +
      `<span class="ath-name">${a.name}</span>` +
      (a.origin ? `<span class="ath-origin">${a.origin}</span>` : '') +
    `</div>`
  ).join('') + (overflow > 0 ? `<div class="ath-overflow">+${overflow} more</div>` : '');

  // Nav segments
  document.getElementById('nav-strip').innerHTML = cats.map((_,i) =>
    `<div class="nav-seg${i===currentIndex?' active':''}"></div>`
  ).join('');

  // Record rendered state — prevents re-triggering animation on every SSE tick
  _lastCatKey = _catKey();

  // Animate: immediate opacity cut → content swap → fast fade-in + sequential row reveal
  const content = document.querySelector('.content');
  content.style.transition = 'none';
  content.style.opacity    = '0';

  setTimeout(() => {
    content.style.transition = 'opacity 0.2s ease';
    content.style.opacity    = '1';
    // Stagger athlete rows — engineered, sequential reveal
    document.querySelectorAll('#disp-athletes .ath-row').forEach((row, i) => {
      setTimeout(() => row.classList.add('in'), i * 42);
    });
  }, 75);

  // Progress bar — not shown in PVW mode (no auto-advance in preview)
  clearTimeout(progressTimer);
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none';
  bar.style.width      = '0%';
  if (!window.PVW_MODE && state.lineupAuto !== false) {
    const dur = (state.lineupDuration || 5) * 1000;
    setTimeout(() => {
      bar.style.transition = `width ${dur}ms linear`;
      bar.style.width      = '100%';
    }, 75);
  }
}

function startAuto() {
  clearInterval(autoTimer);
  if (state.lineupAuto === false) return;
  if (window.PVW_MODE) return; // PVW: director controls category via lineupIndex; no auto-advance
  const dur = (state.lineupDuration || 5) * 1000;
  autoTimer = setInterval(() => {
    const cats = getCategoryData();
    if (cats.length > 1) showCategory(currentIndex + 1);
  }, dur);
}

function stopAuto() {
  clearInterval(autoTimer);
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none';
  bar.style.width      = '0%';
}

function render() {
  const el   = document.getElementById('lineup');
  const want = !!state.lineup;

  if (want && !isVisible) {
    isVisible = true;
    el.classList.add('visible');
    currentIndex = state.lineupIndex || 0;
    showCategory(currentIndex);
    startAuto();
  } else if (!want && isVisible) {
    isVisible    = false;
    _lastCatKey  = null;
    el.classList.remove('visible');
    stopAuto();
  } else if (want && isVisible) {
    const key = _catKey();
    if (key !== _lastCatKey) {
      showCategory(state.lineupIndex !== undefined ? state.lineupIndex : currentIndex);
    }
  }
}

window.onStateUpdate = function(d) {
  const prevIndex = state.lineupIndex;
  Object.assign(state, d);
  if (state.lineup && d.lineupIndex !== undefined && d.lineupIndex !== prevIndex) {
    showCategory(d.lineupIndex);
  } else {
    render();
  }
};

// Two-phase handshake: signal runtime ready first, receive state, then emit overlay-ready after render.
if (window.PVW_MODE) {
  console.log('[lineup] overlay-runtime-ready sending');
  window.parent.postMessage({ type: 'overlay-runtime-ready' }, '*');
}
</script>
</body>
</html>
