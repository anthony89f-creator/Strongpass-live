<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Broadcast Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --green:       #00AA44;
  --green-bright:#00DD55;
  --red:         #C42000;
  --red-mid:     #E03010;
  --red-bright:  #FF4422;
  --gold:        #D4A017;
  --gold-light:  #F5C842;
  --bg:          #060606;
  --panel:       #0C0C0C;
  --rail:        #090909;
  --surface:     #101010;
  --surface2:    #141414;
  --surface3:    #181818;
  --border:      rgba(255,255,255,0.055);
  --border-hi:   rgba(255,255,255,0.11);
  --text:        #EFEFEF;
  --dim:         rgba(255,255,255,0.3);
  --dim2:        rgba(255,255,255,0.14);
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  min-height: 100vh;
  overscroll-behavior: none;
}

/* ── HEADER ──────────────────────────────────────────────────────────── */
.header {
  height: 40px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
}
.header-left { display:flex; align-items:center; gap:10px; }
.back-link {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--dim);
  text-decoration: none;
  transition: color 0.12s, border-color 0.12s;
  white-space: nowrap;
}
.back-link:hover { color: var(--text); border-color: var(--border-hi); }
.header-logo {
  height: 26px;
  width: auto;
  object-fit: contain;
  mix-blend-mode: lighten;
  opacity: 0.8;
}
.header-wordmark {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.header-title {
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #fff;
  line-height: 1;
}
.header-sub {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--dim2);
  font-family: 'Barlow', sans-serif;
}
.conn-wrap { display:flex; align-items:center; gap:5px; }
.conn-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #222;
}
.conn-dot.ok { background: var(--green-bright); }
.conn-text {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--dim);
  font-family: 'Barlow', sans-serif;
}

/* ── PAGE LAYOUT ─────────────────────────────────────────────────────── */
.main {
  padding: 8px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ── COMPETITION STRIP ───────────────────────────────────────────────── */
.comp-strip {
  display: flex;
  align-items: center;
  height: 26px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 12px;
  overflow: hidden;
  gap: 0;
}
.ctx-item {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
  font-family: 'Barlow', sans-serif;
  white-space: nowrap;
  padding: 0 7px;
}
.ctx-item:first-child { padding-left: 0; color: var(--text); font-size: 11px; font-weight: 800; }
.ctx-sep { color: rgba(255,255,255,0.1); font-size: 10px; }

/* ── MONITORS SECTION ────────────────────────────────────────────────── */
/* Unified titanium frame containing PVW | TRANSITION | PGM */
.monitors-section {
  display: flex;
  align-items: stretch;
  background: var(--rail);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 4px;
  overflow: hidden;
}

/* ── MONITOR PANE ────────────────────────────────────────────────────── */
.monitor {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  min-width: 0;
}

/* Colored top rail — the identity strip */
.pvw-monitor { border-top: 2px solid var(--gold); }
.pgm-monitor { border-top: 2px solid var(--red);  }

/* Monitor label bar */
.monitor-head {
  height: 30px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 7px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  flex-shrink: 0;
}
.mon-ind {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.pvw-ind { background: rgba(212,160,23,0.65); }
.pgm-ind {
  background: var(--red-bright);
  animation: live-pulse 1.1s ease-in-out infinite;
}
@keyframes live-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.35; }
}
.mon-label {
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  font-family: 'Barlow', sans-serif;
  line-height: 1;
}
.pvw-monitor .mon-label { color: rgba(212,160,23,0.7); }
.pgm-monitor .mon-label { color: rgba(255,68,34,0.75); }

/* LIVE badge — hard indicator */
.live-badge {
  font-size: 7px;
  font-weight: 900;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-family: 'Barlow', sans-serif;
  color: var(--red-bright);
  background: rgba(196,32,0,0.1);
  border: 1px solid rgba(196,32,0,0.22);
  padding: 2px 5px;
  border-radius: 2px;
}

/* 16:9 screen — maintains aspect ratio from width */
.monitor-body {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
  background: #020202;
  flex-shrink: 0;
}
.monitor-screen {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

/* Subtle inner vignette — recessed screen feel */
.monitor-screen::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  box-shadow: inset 0 0 28px rgba(0,0,0,0.55);
}

/* All overlay iframes — native 1920×1080, scaled down by JS */
.ovl-frame {
  position: absolute;
  top: 0; left: 0;
  width: 1920px; height: 1080px;
  transform-origin: top left;
  border: none;
  pointer-events: none;
}
.pvw-frame { visibility: hidden; }

/* PVW empty state */
.monitor-empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  color: rgba(255,255,255,0.06);
}
.monitor-empty-icon  { font-size: 22px; line-height: 1; }
.monitor-empty-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.34em;
  text-transform: uppercase; font-family: 'Barlow', sans-serif;
}

/* PGM clean state */
.pgm-clean {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; letter-spacing: 0.5em;
  text-transform: uppercase; font-family: 'Barlow', sans-serif;
  color: rgba(255,255,255,0.04);
}
.pgm-clean.visible { display: flex; }

/* Source label bar — below the screen */
.monitor-foot {
  height: 24px;
  padding: 0 12px;
  display: flex; align-items: center; gap: 7px;
  border-top: 1px solid rgba(255,255,255,0.04);
  flex-shrink: 0;
}
.mfoot-tag {
  font-size: 7px; font-weight: 900; letter-spacing: 0.32em;
  text-transform: uppercase; font-family: 'Barlow', sans-serif;
  color: rgba(255,255,255,0.1);
  flex-shrink: 0;
}
/* JS sets className = 'monitor-current' or 'monitor-current active' */
.monitor-current {
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; font-family: 'Barlow', sans-serif;
  color: rgba(255,255,255,0.18);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pvw-monitor .monitor-current.active { color: var(--gold-light); }
.pgm-monitor .monitor-current.active { color: var(--red-mid);    }

/* ── TRANSITION COLUMN ───────────────────────────────────────────────── */
/* The control spine between PVW and PGM */
.transition-col {
  width: 78px;
  flex-shrink: 0;
  background: var(--rail);
  border-left:  1px solid rgba(255,255,255,0.04);
  border-right: 1px solid rgba(255,255,255,0.04);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px 7px;
  gap: 5px;
}
.t-eyebrow {
  font-size: 7px; font-weight: 900; letter-spacing: 0.38em;
  text-transform: uppercase; font-family: 'Barlow', sans-serif;
  color: rgba(255,255,255,0.07);
  margin-bottom: 6px;
}
.t-sep {
  width: 36px; height: 1px;
  background: rgba(255,255,255,0.04);
  margin: 4px 0;
}

/* ── TAKE ── primary transition button */
#take-btn {
  width: 62px;
  padding: 16px 0;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.02);
  color: rgba(255,255,255,0.14);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 900; letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s;
  -webkit-user-select: none; user-select: none;
}
#take-btn.ready {
  background: rgba(0,80,30,0.3);
  border-color: rgba(0,180,70,0.5);
  color: var(--green-bright);
  box-shadow: 0 0 10px rgba(0,180,60,0.07);
}
#take-btn.ready:hover {
  background: rgba(0,100,36,0.45);
  border-color: var(--green);
}
#take-btn:active    { transform: scale(0.96); }
#take-btn:disabled  { opacity: 0.3; cursor: not-allowed; transform: none; }

/* ── CUT ── hard cut, same action */
#cut-btn {
  width: 62px;
  padding: 10px 0;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.05);
  background: transparent;
  color: rgba(255,255,255,0.18);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.1s;
  -webkit-user-select: none; user-select: none;
}
#cut-btn:hover  { border-color: var(--border-hi); color: rgba(255,255,255,0.45); }
#cut-btn:active { transform: scale(0.96); }

/* ── AUTO placeholder */
.auto-btn {
  width: 62px;
  padding: 8px 0;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.03);
  background: transparent;
  color: rgba(255,255,255,0.08);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 800; letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: not-allowed;
  -webkit-user-select: none; user-select: none;
}

/* ── CLEAN ── destructive, visually restrained */
#clean-btn {
  width: 62px;
  padding: 7px 0;
  border-radius: 2px;
  border: 1px solid rgba(150,0,0,0.14);
  background: rgba(80,0,0,0.04);
  color: rgba(200,60,60,0.38);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 800; letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.1s;
  -webkit-user-select: none; user-select: none;
}
#clean-btn:hover  { border-color: rgba(200,0,0,0.28); color: rgba(240,80,80,0.65); }
#clean-btn:active { transform: scale(0.96); }

/* ── OVERLAY SELECTOR ────────────────────────────────────────────────── */
.ovl-selector-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 7px 9px;
}
.ovl-selector-label {
  font-size: 7px; font-weight: 900; letter-spacing: 0.34em;
  text-transform: uppercase; font-family: 'Barlow', sans-serif;
  color: rgba(255,255,255,0.12);
  margin-bottom: 6px;
}
.ovl-selector { display: flex; gap: 5px; }
.ovl-btn {
  flex: 1;
  padding: 9px 6px;
  border-radius: 2px;
  border: 1px solid var(--border);
  background: var(--surface3);
  color: rgba(255,255,255,0.26);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.1s;
  position: relative;
  white-space: nowrap;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
.ovl-btn:hover  { border-color: var(--border-hi); color: rgba(255,255,255,0.55); }
.ovl-btn:active { transform: scale(0.97); }
/* In PVW */
.ovl-btn.selected {
  background: rgba(212,160,23,0.06);
  border-color: rgba(212,160,23,0.45);
  color: var(--gold-light);
}
/* Live on PGM — red pip top-right */
.ovl-btn.live::after {
  content: '';
  position: absolute; top: 5px; right: 5px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--red-bright);
}

/* ── AUTH NOTICE ─────────────────────────────────────────────────────── */
.auth-notice {
  display: none; align-items: center; gap: 10px;
  padding: 7px 12px;
  background: rgba(140,0,0,0.06);
  border: 1px solid rgba(140,0,0,0.2);
  border-radius: 3px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  color: rgba(255,110,110,0.8); font-family: 'Barlow', sans-serif;
}
.auth-notice a { color: rgba(255,150,150,0.9); text-decoration: underline; font-weight: 700; }
.auth-notice.visible { display: flex; }

/* ── STATUS BAR ──────────────────────────────────────────────────────── */
.status-bar {
  height: 26px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  color: var(--dim); font-family: 'Barlow', sans-serif;
}
.status-ok  { color: var(--green-bright); }
.status-err { color: #FF4444; }
.status-time { font-size: 9px; opacity: 0.38; font-variant-numeric: tabular-nums; }

/* ── RESPONSIVE ──────────────────────────────────────────────────────── */
@media (max-width: 800px) {
  .monitors-section { flex-direction: column; }
  .transition-col {
    width: 100%; height: 56px;
    flex-direction: row;
    border-left: none; border-right: none;
    border-top:    1px solid rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    justify-content: center;
  }
  .t-eyebrow { display: none; }
  .t-sep { width: 1px; height: 28px; margin: 0 4px; }
}
@media (max-width: 500px) {
  .ovl-btn { font-size: 10px; min-width: 0; }
}
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────────────── -->
<div class="header">
  <div class="header-left">
    <a class="back-link" href="/control.html">← CONTROL</a>
    <img class="header-logo" src="/logo.png" alt="">
    <div class="header-wordmark">
      <div class="header-title">Broadcast Director</div>
      <div class="header-sub">Preview / Program</div>
    </div>
  </div>
  <div class="conn-wrap">
    <span class="conn-dot" id="conn-dot"></span>
    <span class="conn-text" id="conn-text">Connecting</span>
  </div>
</div>

<div class="main">

  <!-- Competition context strip -->
  <div class="comp-strip">
    <span class="ctx-item" id="ctx-comp">—</span>
    <span class="ctx-sep">·</span>
    <span class="ctx-item" id="ctx-event">—</span>
    <span class="ctx-sep">·</span>
    <span class="ctx-item">Heat <span id="ctx-heat">—</span></span>
    <span class="ctx-sep">·</span>
    <span class="ctx-item" id="ctx-cat">—</span>
  </div>

  <!-- ── MONITOR ROW ─────────────────────────────────────────────────── -->
  <div class="monitors-section">

    <!-- PREVIEW — left, amber -->
    <div class="monitor pvw-monitor">
      <div class="monitor-head">
        <span class="mon-ind pvw-ind"></span>
        <span class="mon-label">Preview</span>
      </div>
      <div class="monitor-body" id="pvw-body">
        <div class="monitor-screen" id="pvw-screen"></div>
        <div class="monitor-empty" id="pvw-empty">
          <div class="monitor-empty-icon">▷</div>
          <div class="monitor-empty-label">Select an overlay</div>
        </div>
      </div>
      <div class="monitor-foot">
        <span class="mfoot-tag">PVW</span>
        <span class="monitor-current" id="pvw-current">—</span>
      </div>
    </div>

    <!-- TRANSITION — control spine -->
    <div class="transition-col">
      <div class="t-eyebrow">T/S</div>
      <button id="take-btn" onclick="take()">TAKE</button>
      <button id="cut-btn"  onclick="take()">CUT</button>
      <div class="t-sep"></div>
      <button class="auto-btn" disabled>AUTO</button>
      <div class="t-sep"></div>
      <button id="clean-btn" onclick="goClean()">CLN</button>
    </div>

    <!-- PROGRAM — right, red -->
    <div class="monitor pgm-monitor">
      <div class="monitor-head">
        <span class="mon-ind pgm-ind"></span>
        <span class="mon-label">Program</span>
        <span class="live-badge">Live</span>
      </div>
      <div class="monitor-body" id="pgm-body">
        <div class="monitor-screen" id="pgm-screen"></div>
        <div class="pgm-clean" id="pgm-clean">CLEAN</div>
      </div>
      <div class="monitor-foot">
        <span class="mfoot-tag">PGM</span>
        <span class="monitor-current" id="pgm-current">—</span>
      </div>
    </div>

  </div><!-- /monitors-section -->

  <!-- Overlay selector strip -->
  <div class="ovl-selector-wrap">
    <div class="ovl-selector-label">Preview Select</div>
    <div class="ovl-selector" id="ovl-selector"></div>
  </div>

  <!-- Auth notice (hidden until 401) -->
  <div class="auth-notice" id="auth-notice">
    <span>Operator login required —</span>
    <a href="/comp/login" target="_blank">Log in at /comp/login</a>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span id="status-text">Ready</span>
    <span id="status-time" class="status-time"></span>
  </div>

</div><!-- /main -->

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
// Token passed through to iframes so they can authenticate with /stream
var _token = new URLSearchParams(window.location.search).get('token') || '';
var Q      = _token ? ('?token=' + encodeURIComponent(_token)) : '';

// Overlay definitions.
// pvwFlags: flags forced true in PVW iframe injection.
// pgmKeys:  flags checked to determine if this overlay is live in PGM.
// takeFlags: flags set true on TAKE; everything else in ALL_FLAGS is set false.
var OVERLAYS = [
  { key:'leaderboard', label:'Leaderboard',  src:'/leaderboard.html', pvwFlags:['leaderboard','eventBarVisible'], pgmKeys:['leaderboard'] },
  { key:'h2h',         label:'Head To Head', src:'/h2h.html',         pvwFlags:['h2h'],                          pgmKeys:['h2h'] },
  { key:'lineup',      label:'Lineup',       src:'/lineup.html',      pvwFlags:['lineup'],                       pgmKeys:['lineup'] },
  { key:'lowerthird',  label:'Lower Third',  src:'/lowerthird.html',  pvwFlags:['lowerThirdVisible'],            pgmKeys:['lowerThirdVisible'] },
  { key:'reps',        label:'Reps / Lights',src:'/reps.html',        pvwFlags:['repsVisible','lightsVisible'],  pgmKeys:['repsVisible','lightsVisible'] },
  { key:'champion',    label:'Champion',     src:'/champion.html',    pvwFlags:['champion'],                     pgmKeys:['champion'] },
];

// All overlay visibility flags managed by director TAKE/CLEAN
var ALL_FLAGS = ['leaderboard','eventBarVisible','h2h','lineup','lowerThirdVisible','repsVisible','lightsVisible','champion'];

// ─── STATE ────────────────────────────────────────────────────────────────────
var liveState    = {};
var pvwSelection = null;   // key of overlay currently shown in PVW

// ─── SSE CONNECTION (director page) ──────────────────────────────────────────
var _es = null, _retryTimer = null, _retryMs = 1000;

function setConn(ok) {
  document.getElementById('conn-dot').className    = 'conn-dot' + (ok ? ' ok' : '');
  document.getElementById('conn-text').textContent = ok ? 'Connected' : 'Disconnected';
  document.getElementById('conn-text').style.color = ok ? 'var(--green-bright)' : '#FF5555';
}
function connect() {
  if (_es) { _es.close(); _es = null; }
  var url = '/stream' + (Q ? Q.replace('?','?') : (Q || ''));
  _es = new EventSource('/stream' + Q);
  _es.onopen    = function()  { _retryMs = 1000; setConn(true); };
  _es.onmessage = function(e) { try { onStateUpdate(JSON.parse(e.data)); } catch(_) {} };
  _es.onerror   = function()  {
    setConn(false); _es.close(); _es = null;
    _retryTimer = setTimeout(connect, _retryMs);
    _retryMs    = Math.min(_retryMs * 2, 30000);
  };
}
function disconnect() {
  if (_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; }
  if (_es)         { _es.close(); _es = null; }
}
function fetchState() {
  fetch('/state.json?t=' + Date.now(), { cache:'no-store' })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) { if (d) onStateUpdate(d); })
    .catch(function() {});
}
window.addEventListener('pagehide', disconnect);
window.addEventListener('pageshow', function(e) { if (e.persisted) { connect(); fetchState(); } });
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) { if (!_es) connect(); fetchState(); }
});

// ─── STATE UPDATE ─────────────────────────────────────────────────────────────
function onStateUpdate(d) {
  Object.assign(liveState, d);
  renderCtxStrip();
  renderPGMStatus();
  renderOvlButtons();
  // If a PVW overlay is selected, refresh it with latest live data
  if (pvwSelection) {
    var frame = document.getElementById('pvw-frame-' + pvwSelection);
    var ovl   = OVERLAYS.find(function(o) { return o.key === pvwSelection; });
    if (frame && ovl && frame._ready) refreshPVW(frame, ovl.pvwFlags);
  }
}

// ─── CONTEXT STRIP ────────────────────────────────────────────────────────────
function renderCtxStrip() {
  var s = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v || '—'; };
  s('ctx-comp',  liveState.compName      || liveState.compEventName || '');
  s('ctx-event', liveState.compEventName || liveState.eventName     || '');
  s('ctx-heat',  liveState.compHeat                                 || '');
  s('ctx-cat',   liveState.compCategory  || liveState.category      || '');
}

// ─── PGM STATUS ──────────────────────────────────────────────────────────────
function renderPGMStatus() {
  var live = OVERLAYS.filter(function(o) {
    return o.pgmKeys.some(function(f) { return !!liveState[f]; });
  });
  var label   = live.length ? live.map(function(o) { return o.label; }).join(' + ') : 'Clean';
  var current = document.getElementById('pgm-current');
  if (current) { current.textContent = label; current.className = 'monitor-current' + (live.length ? ' active' : ''); }
  var cleanEl = document.getElementById('pgm-clean');
  if (cleanEl) cleanEl.classList.toggle('visible', live.length === 0);
}

// ─── OVERLAY BUTTONS ─────────────────────────────────────────────────────────
function renderOvlButtons() {
  OVERLAYS.forEach(function(o) {
    var btn = document.querySelector('.ovl-btn[data-key="' + o.key + '"]');
    if (!btn) return;
    var isLive = o.pgmKeys.some(function(f) { return !!liveState[f]; });
    btn.classList.toggle('live',     isLive);
    btn.classList.toggle('selected', pvwSelection === o.key);
  });
}

// ─── PVW IFRAME INJECTION ─────────────────────────────────────────────────────
// After a PVW iframe loads, we override its window.onStateUpdate so it always
// receives the flagged overlay as visible — regardless of live state.json flags.
// Same-origin iframes allow direct contentWindow property access.
function injectPVWOverride(frame, flags) {
  try {
    var cw = frame.contentWindow;
    if (!cw || typeof cw.onStateUpdate !== 'function') return;
    // Store original handler once; don't re-wrap on repeated calls
    if (!frame._origUpdate) frame._origUpdate = cw.onStateUpdate;
    var orig = frame._origUpdate;
    cw.onStateUpdate = function(d) {
      var p = Object.assign({}, d);
      flags.forEach(function(f) { p[f] = true; });
      orig.call(cw, p);
    };
  } catch(e) {}
}

function refreshPVW(frame, flags) {
  injectPVWOverride(frame, flags);
  try {
    // Re-dispatch current live state with forced flags so PVW renders latest data
    if (frame.contentWindow && typeof frame.contentWindow.onStateUpdate === 'function') {
      frame.contentWindow.onStateUpdate(Object.assign({}, liveState));
    }
  } catch(e) {}
}

// ─── OVERLAY SELECTOR ─────────────────────────────────────────────────────────
function selectPVW(key) {
  pvwSelection = key;

  // Visibility: show selected iframe, hide others
  OVERLAYS.forEach(function(o) {
    var f = document.getElementById('pvw-frame-' + o.key);
    if (f) f.style.visibility = (o.key === key) ? 'visible' : 'hidden';
  });

  // Empty state placeholder
  document.getElementById('pvw-empty').style.display = key ? 'none' : 'flex';

  // Update PVW header label
  var ovl = OVERLAYS.find(function(o) { return o.key === key; });
  var cur = document.getElementById('pvw-current');
  if (cur) { cur.textContent = ovl ? ovl.label : '—'; cur.className = 'monitor-current' + (key ? ' active' : ''); }

  // Update button selection state
  renderOvlButtons();

  // Inject force-visible and trigger render if frame is already loaded
  if (key && ovl) {
    var frame = document.getElementById('pvw-frame-' + key);
    if (frame && frame._ready) refreshPVW(frame, ovl.pvwFlags);
  }

  updateTakeBtn();
}

// ─── TAKE BUTTON STATE ────────────────────────────────────────────────────────
function updateTakeBtn() {
  document.getElementById('take-btn').classList.toggle('ready', pvwSelection !== null);
}

// ─── TAKE ─────────────────────────────────────────────────────────────────────
async function take() {
  if (!pvwSelection) return;
  var ovl = OVERLAYS.find(function(o) { return o.key === pvwSelection; });
  if (!ovl) return;

  // Build payload: selected overlay's flags ON, everything else OFF
  var payload = {};
  ALL_FLAGS.forEach(function(f) { payload[f] = false; });
  ovl.pvwFlags.forEach(function(f) { payload[f] = true; });

  var btn = document.getElementById('take-btn');
  btn.disabled = true;
  try {
    var r = await fetch('/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      credentials: 'include',
    });
    if (r.status === 401 || r.status === 403 || (r.redirected && r.url.indexOf('login') !== -1)) {
      document.getElementById('auth-notice').classList.add('visible');
      showStatus('Login required — see link below', false);
    } else if (r.ok) {
      document.getElementById('auth-notice').classList.remove('visible');
      Object.assign(liveState, payload);
      renderPGMStatus();
      renderOvlButtons();
      showStatus('Taken live — ' + ovl.label, true);
    } else {
      showStatus('Server error (' + r.status + ')', false);
    }
  } catch(e) {
    showStatus('Network error', false);
  } finally {
    btn.disabled = false;
  }
}

// ─── CLEAN ────────────────────────────────────────────────────────────────────
async function goClean() {
  var payload = {};
  ALL_FLAGS.forEach(function(f) { payload[f] = false; });
  try {
    var r = await fetch('/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      credentials: 'include',
    });
    if (r.ok) {
      Object.assign(liveState, payload);
      renderPGMStatus();
      renderOvlButtons();
      showStatus('Clean — all overlays off', true);
    } else {
      showStatus('Error (' + r.status + ')', false);
    }
  } catch(e) {
    showStatus('Network error', false);
  }
}

// ─── STATUS BAR ───────────────────────────────────────────────────────────────
function showStatus(msg, ok) {
  var el   = document.getElementById('status-text');
  var time = document.getElementById('status-time');
  el.textContent = msg;
  el.className   = ok ? 'status-ok' : 'status-err';
  var n = new Date();
  time.textContent = String(n.getHours()).padStart(2,'0') + ':' +
                     String(n.getMinutes()).padStart(2,'0') + ':' +
                     String(n.getSeconds()).padStart(2,'0');
}

// ─── SCALE IFRAMES TO FIT MONITORS ───────────────────────────────────────────
function applyScale() {
  var pvwBody = document.getElementById('pvw-body');
  if (!pvwBody) return;
  var scale = pvwBody.offsetWidth / 1920;
  document.querySelectorAll('.ovl-frame').forEach(function(el) {
    el.style.transform = 'scale(' + scale + ')';
  });
}
window.addEventListener('resize', function() {
  clearTimeout(window._scaleTimer);
  window._scaleTimer = setTimeout(applyScale, 40);
});

// ─── BUILD IFRAMES AND SELECTOR BUTTONS ──────────────────────────────────────
(function init() {
  var pvwScreen  = document.getElementById('pvw-screen');
  var pgmScreen  = document.getElementById('pgm-screen');
  var selectorEl = document.getElementById('ovl-selector');

  OVERLAYS.forEach(function(ovl) {
    var src = ovl.src + Q;

    // PVW iframe — hidden until selected; injection happens on load
    var pvwFrame       = document.createElement('iframe');
    pvwFrame.id        = 'pvw-frame-' + ovl.key;
    pvwFrame.className = 'ovl-frame pvw-frame';
    pvwFrame.src       = src;
    pvwFrame._ready    = false;
    pvwFrame._origUpdate = null;
    pvwFrame.addEventListener('load', (function(frame, o) {
      return function() {
        frame._ready = true;
        // If this overlay is currently selected in PVW, inject immediately
        if (pvwSelection === o.key) refreshPVW(frame, o.pvwFlags);
      };
    }(pvwFrame, ovl)));
    pvwScreen.appendChild(pvwFrame);

    // PGM iframe — always visible, self-manages via its own SSE + sse-client.js
    var pgmFrame       = document.createElement('iframe');
    pgmFrame.id        = 'pgm-frame-' + ovl.key;
    pgmFrame.className = 'ovl-frame';
    pgmFrame.src       = src;
    pgmScreen.appendChild(pgmFrame);

    // Overlay selector button
    var btn = document.createElement('button');
    btn.className    = 'ovl-btn';
    btn.dataset.key  = ovl.key;
    btn.textContent  = ovl.label;
    btn.addEventListener('click', (function(key) {
      return function() { selectPVW(key); };
    }(ovl.key)));
    selectorEl.appendChild(btn);
  });

  // Apply scale after layout — iframes are 1920px wide, need scaling to fit
  setTimeout(applyScale, 80);

  // Kick off director SSE + state fetch
  fetchState();
  connect();
}());
</script>
</body>
