<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Broadcast Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
/* ── RESET + TOKENS ─────────────────────────────────────────────────────── */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --green:       #00AA44;
  --green-bright:#00DD55;
  --red:         #BB1E00;
  --red-mid:     #DD2D0D;
  --red-bright:  #FF4422;
  --gold:        #D4A017;
  --gold-light:  #F5C842;
  --bg:          #060606;
  --panel:       #0B0B0B;
  --rail:        #080808;
  --surface:     #0F0F0F;
  --surface2:    #131313;
  --surface3:    #171717;
  --border:      rgba(255,255,255,0.052);
  --border-hi:   rgba(255,255,255,0.11);
  --text:        #EFEFEF;
  --dim:         rgba(255,255,255,0.3);
  --dim2:        rgba(255,255,255,0.13);
}

/* ── VIEWPORT LOCK ──────────────────────────────────────────────────────── */
/* Director is a fullscreen operator panel — no page scroll */
html { height: 100%; }
body {
  height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  display: flex; flex-direction: column;
  overscroll-behavior: none;
}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
.header {
  height: 38px; flex-shrink: 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 12px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 200;
}
.header-left  { display:flex; align-items:center; gap:9px; }
.back-link {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 3px;
  padding: 3px 9px; font-size: 9px; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--dim); text-decoration: none;
  transition: color 0.12s, border-color 0.12s; white-space: nowrap;
}
.back-link:hover { color: var(--text); border-color: var(--border-hi); }
.header-logo  { height: 24px; width: auto; object-fit: contain; mix-blend-mode: lighten; opacity: 0.75; }
.header-title { font-size: 12px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; color: #fff; line-height: 1; }
.header-sub   { font-size: 7px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim2); font-family: 'Barlow', sans-serif; margin-top: 1px; }
.conn-wrap    { display:flex; align-items:center; gap:5px; }
.conn-dot     { width:5px; height:5px; border-radius:50%; background:#1e1e1e; flex-shrink:0; }
.conn-dot.ok  { background:var(--green-bright); }
.conn-text    { font-size:9px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); font-family:'Barlow',sans-serif; }

/* ── MAIN LAYOUT ────────────────────────────────────────────────────────── */
/* Fills remaining viewport after header. No scroll. */
.main {
  flex: 1; min-height: 0;
  padding: 5px 9px 6px;
  display: flex; flex-direction: column; gap: 4px;
  overflow: hidden;
}

/* ── COMP STRIP ─────────────────────────────────────────────────────────── */
.comp-strip {
  flex-shrink: 0; height: 20px;
  display: flex; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  padding: 0 10px; overflow: hidden;
}
.ctx-item {
  font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(255,255,255,0.25); font-family:'Barlow',sans-serif; white-space:nowrap; padding: 0 6px;
}
.ctx-item:first-child { padding-left:0; color:var(--text); font-size:10px; font-weight:800; }
.ctx-sep { color:rgba(255,255,255,0.09); font-size:9px; }

/* ── MONITORS SECTION ───────────────────────────────────────────────────── */
/* Takes all remaining vertical space — this is the money area */
.monitors-section {
  flex: 1; min-height: 0;
  display: flex; align-items: stretch;
  background: var(--rail);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 3px; overflow: hidden;
}

/* ── MONITOR PANE ───────────────────────────────────────────────────────── */
.monitor {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--panel);
}

/* Colored identity rail */
.pvw-monitor { border-top: 3px solid var(--gold); }
.pgm-monitor {
  border-top: 3px solid var(--red);
  box-shadow: inset 0 0 0 0 transparent;
  transition: box-shadow 0.25s ease;
}
/* On-air tally glow — activated when any overlay is live */
.pgm-monitor.on-air {
  box-shadow: inset 0 0 0 1px rgba(187,30,0,0.22);
}

/* Label bars */
.monitor-head {
  flex-shrink: 0; height: 24px; padding: 0 10px;
  display: flex; align-items: center; gap: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background 0.25s ease;
}
.pgm-monitor.on-air .monitor-head { background: rgba(187,30,0,0.06); }

.mon-ind { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.pvw-ind { background: rgba(212,160,23,0.6); }
.pgm-ind { background: var(--red-bright); animation: live-pulse 1s ease-in-out infinite; }
@keyframes live-pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.mon-label {
  font-size: 8px; font-weight: 900; letter-spacing: 0.36em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; line-height: 1;
}
.pvw-monitor .mon-label { color: rgba(212,160,23,0.65); }
.pgm-monitor .mon-label { color: rgba(255,68,34,0.7); }

.live-badge {
  font-size: 6px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: var(--red-bright);
  background: rgba(187,30,0,0.1); border: 1px solid rgba(187,30,0,0.2);
  padding: 1px 4px; border-radius: 2px;
}

/* Screen: fills the full monitor height — no padding-bottom 56.25% trick */
.monitor-body {
  flex: 1; min-height: 0;
  position: relative;
  background: #010101;
}
.monitor-screen {
  position: absolute; inset: 0;
  overflow: hidden;
}
/* Recessed screen vignette */
.monitor-screen::after {
  content: ''; position: absolute; inset: 0;
  pointer-events: none; z-index: 50;
  box-shadow: inset 0 0 24px rgba(0,0,0,0.6);
}

/* Overlay iframes — native 1920×1080, positioned and scaled by JS */
.ovl-frame {
  position: absolute; top: 0; left: 0;
  width: 1920px; height: 1080px;
  transform-origin: top left;
  border: none; pointer-events: none;
  background: transparent; /* critical: Safari treats iframes as opaque without this */
}
.pvw-frame { visibility: hidden; } /* JS shows only the selected one */
.pgm-frame { visibility: hidden; } /* JS shows only the live one via renderPGMVisibility() */

/* Empty placeholder when no PVW selection */
.monitor-empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  color: rgba(255,255,255,0.06);
}
.monitor-empty-icon  { font-size: 20px; line-height: 1; }
.monitor-empty-label { font-size: 8px; font-weight: 700; letter-spacing: 0.36em; text-transform: uppercase; font-family:'Barlow',sans-serif; }

/* PGM clean state label */
.pgm-clean {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; letter-spacing: 0.56em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.04);
}
.pgm-clean.visible { display: flex; }

/* Source label footer */
.monitor-foot {
  flex-shrink: 0; height: 20px; padding: 0 10px;
  display: flex; align-items: center; gap: 6px;
  border-top: 1px solid rgba(255,255,255,0.04);
}
.mfoot-tag {
  font-size: 7px; font-weight: 900; letter-spacing: 0.32em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.09); flex-shrink: 0;
}
/* className set by JS: 'monitor-current' or 'monitor-current active' */
.monitor-current {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.16);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pvw-monitor .monitor-current.active { color: var(--gold-light); }
.pgm-monitor .monitor-current.active { color: var(--red-mid); }

/* ── TRANSITION SPINE ───────────────────────────────────────────────────── */
/* The control column between PVW and PGM */
.transition-col {
  width: 84px; flex-shrink: 0;
  background: var(--rail);
  border-left:  1px solid rgba(255,255,255,0.04);
  border-right: 1px solid rgba(255,255,255,0.04);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 12px 6px; gap: 5px;
}
.t-eyebrow {
  font-size: 6px; font-weight: 900; letter-spacing: 0.4em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.06); margin-bottom: 5px;
}
.t-sep { width: 40px; height: 1px; background: rgba(255,255,255,0.04); margin: 3px 0; }

#take-btn {
  width: 66px; padding: 17px 0;
  border-radius: 2px; border: 1px solid rgba(255,255,255,0.05);
  background: rgba(255,255,255,0.015); color: rgba(255,255,255,0.12);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase;
  cursor: pointer; transition: background 0.14s, border-color 0.14s, color 0.14s, box-shadow 0.14s;
  -webkit-user-select: none; user-select: none;
}
#take-btn.ready {
  background: rgba(0,90,35,0.32);
  border-color: rgba(0,185,75,0.55);
  color: var(--green-bright);
  box-shadow: 0 0 14px rgba(0,180,60,0.08);
}
#take-btn.ready:hover  { background: rgba(0,110,42,0.48); border-color: var(--green); }
#take-btn:active       { transform: scale(0.95); }
#take-btn:disabled     { opacity: 0.3; cursor: not-allowed; transform: none; }

/* CUT = cut current PGM overlay to clean */
#cut-btn {
  width: 66px; padding: 11px 0;
  border-radius: 2px; border: 1px solid rgba(255,255,255,0.05);
  background: transparent; color: rgba(255,255,255,0.18);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
  cursor: pointer; transition: all 0.1s;
  -webkit-user-select: none; user-select: none;
}
#cut-btn:hover  { border-color: var(--border-hi); color: rgba(255,255,255,0.5); }
#cut-btn:active { transform: scale(0.96); }

.auto-btn {
  width: 66px; padding: 8px 0;
  border-radius: 2px; border: 1px solid rgba(255,255,255,0.03);
  background: transparent; color: rgba(255,255,255,0.07);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase;
  cursor: not-allowed;
}

#clean-btn {
  width: 66px; padding: 8px 0;
  border-radius: 2px; border: 1px solid rgba(130,0,0,0.14);
  background: rgba(70,0,0,0.04); color: rgba(200,60,60,0.38);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; transition: all 0.1s;
  -webkit-user-select: none; user-select: none;
}
#clean-btn:hover  { border-color: rgba(200,0,0,0.28); color: rgba(240,80,80,0.65); }
#clean-btn:active { transform: scale(0.96); }

/* ── OVERLAY SELECTOR ───────────────────────────────────────────────────── */
.ovl-selector-wrap {
  flex-shrink: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  padding: 6px 8px;
}
.ovl-selector-label {
  font-size: 6px; font-weight: 900; letter-spacing: 0.36em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.1); margin-bottom: 5px;
}
.ovl-selector { display:flex; gap:4px; }
.ovl-btn {
  flex: 1; padding: 8px 5px;
  border-radius: 2px; border: 1px solid var(--border); background: var(--surface3);
  color: rgba(255,255,255,0.24);
  font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 800;
  letter-spacing: 0.09em; text-transform: uppercase;
  cursor: pointer; transition: all 0.1s; position: relative; white-space: nowrap;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.ovl-btn:hover  { border-color: var(--border-hi); color: rgba(255,255,255,0.55); }
.ovl-btn:active { transform: scale(0.97); }
.ovl-btn.selected {
  background: rgba(212,160,23,0.06); border-color: rgba(212,160,23,0.42); color: var(--gold-light);
}
/* Red pip = live on PGM */
.ovl-btn.live::after {
  content: ''; position: absolute; top: 4px; right: 4px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--red-bright);
}

/* ── INLINE OVERLAY CONTROLS ────────────────────────────────────────────── */
/* Contextual controls appear below selector when an overlay with controls is selected */
.ctrl-panel {
  flex-shrink: 0;
  display: none; /* JS shows this as flex when there are controls */
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  padding: 5px 8px; gap: 5px;
  align-items: center; flex-wrap: wrap;
}
.ctrl-panel.open { display: flex; }

.ctrl-label {
  font-size: 7px; font-weight: 900; letter-spacing: 0.3em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.22); white-space: nowrap; flex-shrink: 0;
}
.ctrl-sep { width:1px; height:18px; background:rgba(255,255,255,0.06); margin:0 3px; flex-shrink:0; }
.ctrl-select {
  background: var(--surface3); border: 1px solid var(--border); border-radius: 2px;
  color: var(--text); font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  padding: 3px 6px; cursor: pointer; outline: none; max-width: 160px;
}
.ctrl-select:focus { border-color: rgba(212,160,23,0.35); }
.ctrl-btn {
  background: var(--surface3); border: 1px solid var(--border); border-radius: 2px;
  color: rgba(255,255,255,0.35); font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 8px; cursor: pointer; transition: all 0.1s; flex-shrink: 0;
  -webkit-user-select: none; user-select: none;
}
.ctrl-btn:hover  { border-color: var(--border-hi); color: rgba(255,255,255,0.65); }
.ctrl-btn:active { transform: scale(0.97); }
.ctrl-btn.active {
  background: rgba(212,160,23,0.08); border-color: rgba(212,160,23,0.38); color: var(--gold-light);
}
.ctrl-btn.danger       { border-color: rgba(180,0,0,0.2); color: rgba(220,70,70,0.55); }
.ctrl-btn.danger:hover { border-color: rgba(220,0,0,0.4); color: rgba(255,80,80,0.8); }
.ctrl-input {
  background: var(--surface3); border: 1px solid var(--border); border-radius: 2px;
  color: var(--text); font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700; padding: 3px 7px; width: 130px; outline: none;
}
.ctrl-input:focus { border-color: rgba(212,160,23,0.35); }

/* ── AUTH + STATUS ──────────────────────────────────────────────────────── */
.auth-notice {
  flex-shrink: 0; display: none; align-items: center; gap: 10px;
  padding: 5px 10px;
  background: rgba(130,0,0,0.06); border: 1px solid rgba(130,0,0,0.2); border-radius: 2px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
  color: rgba(255,110,110,0.8); font-family: 'Barlow', sans-serif;
}
.auth-notice a { color: rgba(255,150,150,0.9); text-decoration: underline; font-weight: 700; }
.auth-notice.visible { display: flex; }

.status-bar {
  flex-shrink: 0; height: 22px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  font-size: 9px; font-weight: 600; letter-spacing: 0.12em;
  color: var(--dim); font-family: 'Barlow', sans-serif;
}
.status-ok  { color: var(--green-bright); }
.status-err { color: #FF4444; }
.status-time { opacity: 0.35; font-variant-numeric: tabular-nums; }

/* ── RESPONSIVE ─────────────────────────────────────────────────────────── */
@media (max-width: 800px) {
  .monitors-section { flex-direction: column; }
  .transition-col {
    width: 100%; height: 52px; flex-direction: row;
    border-left: none; border-right: none;
    border-top: 1px solid rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    justify-content: center;
  }
  .t-eyebrow { display: none; }
  .t-sep { width: 1px; height: 26px; margin: 0 3px; }
}
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────────────────── -->
<div class="header">
  <div class="header-left">
    <a class="back-link" href="/control.html">← CONTROL</a>
    <img class="header-logo" src="/logo.png" alt="">
    <div>
      <div class="header-title">Broadcast Director</div>
      <div class="header-sub">Preview / Program</div>
    </div>
  </div>
  <div class="conn-wrap">
    <span class="conn-dot" id="conn-dot"></span>
    <span class="conn-text" id="conn-text">Connecting</span>
  </div>
</div>

<div class="main">

  <!-- Competition context -->
  <div class="comp-strip">
    <span class="ctx-item" id="ctx-comp">—</span>
    <span class="ctx-sep">·</span>
    <span class="ctx-item" id="ctx-event">—</span>
    <span class="ctx-sep">·</span>
    <span class="ctx-item">Heat <span id="ctx-heat">—</span></span>
    <span class="ctx-sep">·</span>
    <span class="ctx-item" id="ctx-cat">—</span>
  </div>

  <!-- ── MONITOR ROW ──────────────────────────────────────────────────────── -->
  <div class="monitors-section">

    <!-- PREVIEW — amber -->
    <div class="monitor pvw-monitor" id="pvw-monitor">
      <div class="monitor-head">
        <span class="mon-ind pvw-ind"></span>
        <span class="mon-label">Preview</span>
      </div>
      <div class="monitor-body" id="pvw-body">
        <div class="monitor-screen" id="pvw-screen"></div>
        <div class="monitor-empty" id="pvw-empty">
          <div class="monitor-empty-icon">▷</div>
          <div class="monitor-empty-label">Select an overlay</div>
        </div>
      </div>
      <div class="monitor-foot">
        <span class="mfoot-tag">PVW</span>
        <span class="monitor-current" id="pvw-current">—</span>
      </div>
    </div>

    <!-- TRANSITION SPINE -->
    <div class="transition-col">
      <div class="t-eyebrow">T/S</div>
      <button id="take-btn" onclick="take()">TAKE</button>
      <button id="cut-btn"  onclick="goClean()">CUT</button>
      <div class="t-sep"></div>
      <button class="auto-btn" disabled>AUTO</button>
      <div class="t-sep"></div>
      <button id="clean-btn" onclick="goClean()">CLN</button>
    </div>

    <!-- PROGRAM — red/live -->
    <div class="monitor pgm-monitor" id="pgm-monitor">
      <div class="monitor-head">
        <span class="mon-ind pgm-ind"></span>
        <span class="mon-label">Program</span>
        <span class="live-badge">Live</span>
      </div>
      <div class="monitor-body" id="pgm-body">
        <div class="monitor-screen" id="pgm-screen"></div>
        <div class="pgm-clean" id="pgm-clean">CLEAN</div>
      </div>
      <div class="monitor-foot">
        <span class="mfoot-tag">PGM</span>
        <span class="monitor-current" id="pgm-current">—</span>
      </div>
    </div>

  </div><!-- /monitors-section -->

  <!-- Overlay selector -->
  <div class="ovl-selector-wrap">
    <div class="ovl-selector-label">Preview Select</div>
    <div class="ovl-selector" id="ovl-selector"></div>
  </div>

  <!-- Contextual overlay controls — shown when relevant overlay is selected in PVW -->
  <div class="ctrl-panel" id="ctrl-panel"></div>

  <!-- Auth notice -->
  <div class="auth-notice" id="auth-notice">
    <span>Operator login required —</span>
    <a href="/comp/login" target="_blank">Log in at /comp/login</a>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span id="status-text">Ready</span>
    <span id="status-time" class="status-time"></span>
  </div>

</div><!-- /main -->

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
var _token = new URLSearchParams(window.location.search).get('token') || '';
var Q      = _token ? ('?token=' + encodeURIComponent(_token)) : '';

var OVERLAYS = [
  { key:'leaderboard', label:'Leaderboard',   src:'/leaderboard.html', pvwFlags:['leaderboard','eventBarVisible'], pgmKeys:['leaderboard'] },
  { key:'h2h',         label:'Head To Head',  src:'/h2h.html',         pvwFlags:['h2h'],                          pgmKeys:['h2h'] },
  { key:'lineup',      label:'Lineup',        src:'/lineup.html',      pvwFlags:['lineup'],                       pgmKeys:['lineup'] },
  { key:'lowerthird',  label:'Lower Third',   src:'/lowerthird.html',  pvwFlags:['lowerThirdVisible'],            pgmKeys:['lowerThirdVisible'] },
  { key:'reps',        label:'Reps / Lights', src:'/reps.html',        pvwFlags:['repsVisible','lightsVisible'],  pgmKeys:['repsVisible','lightsVisible'] },
  { key:'champion',    label:'Champion',      src:'/champion.html',    pvwFlags:['champion'],                     pgmKeys:['champion'] },
];
var ALL_FLAGS = ['leaderboard','eventBarVisible','h2h','lineup','lowerThirdVisible','repsVisible','lightsVisible','champion'];

// ─── STATE ────────────────────────────────────────────────────────────────────
var liveState    = {};
var pvwSelection = null;

// ─── SSE ──────────────────────────────────────────────────────────────────────
var _es = null, _retryTimer = null, _retryMs = 1000;

function setConn(ok) {
  document.getElementById('conn-dot').className    = 'conn-dot' + (ok ? ' ok' : '');
  document.getElementById('conn-text').textContent = ok ? 'Connected' : 'Disconnected';
  document.getElementById('conn-text').style.color = ok ? 'var(--green-bright)' : '#FF5555';
}
function connect() {
  if (_es) { _es.close(); _es = null; }
  _es = new EventSource('/stream' + Q);
  _es.onopen    = function()  { _retryMs = 1000; setConn(true); };
  _es.onmessage = function(e) { try { onStateUpdate(JSON.parse(e.data)); } catch(_) {} };
  _es.onerror   = function()  {
    setConn(false); _es.close(); _es = null;
    _retryTimer = setTimeout(connect, _retryMs);
    _retryMs    = Math.min(_retryMs * 2, 30000);
  };
}
function disconnect() {
  if (_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; }
  if (_es)         { _es.close(); _es = null; }
}
function fetchState() {
  fetch('/state.json?t=' + Date.now(), { cache:'no-store' })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) { if (d) onStateUpdate(d); })
    .catch(function() {});
}
window.addEventListener('pagehide', disconnect);
window.addEventListener('pageshow', function(e) { if (e.persisted) { connect(); fetchState(); } });
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) { if (!_es) connect(); fetchState(); }
});

// ─── STATE UPDATE ─────────────────────────────────────────────────────────────
function onStateUpdate(d) {
  Object.assign(liveState, d);
  renderCtxStrip();
  renderPGMStatus();
  renderPGMVisibility();
  renderOvlButtons();
  renderCtrlPanel();
  if (pvwSelection) {
    var frame = document.getElementById('pvw-frame-' + pvwSelection);
    var ovl   = OVERLAYS.find(function(o) { return o.key === pvwSelection; });
    if (frame && ovl && frame._ready) refreshPVW(frame, ovl.pvwFlags);
  }
}

// ─── CONTEXT STRIP ────────────────────────────────────────────────────────────
function renderCtxStrip() {
  var s = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v || '—'; };
  s('ctx-comp',  liveState.compName      || liveState.compEventName || '');
  s('ctx-event', liveState.compEventName || liveState.eventName     || '');
  s('ctx-heat',  liveState.compHeat                                 || '');
  s('ctx-cat',   liveState.compCategory  || liveState.category      || '');
}

// ─── PGM STATUS ───────────────────────────────────────────────────────────────
function renderPGMStatus() {
  var live = OVERLAYS.filter(function(o) {
    return o.pgmKeys.some(function(f) { return !!liveState[f]; });
  });
  var isOnAir = live.length > 0;
  var label   = isOnAir ? live.map(function(o) { return o.label; }).join(' + ') : 'Clean';

  var current = document.getElementById('pgm-current');
  if (current) { current.textContent = label; current.className = 'monitor-current' + (isOnAir ? ' active' : ''); }

  var cleanEl = document.getElementById('pgm-clean');
  if (cleanEl) cleanEl.classList.toggle('visible', !isOnAir);

  // On-air tally — tints the PGM monitor frame when something is live
  var pgmMon = document.getElementById('pgm-monitor');
  if (pgmMon) pgmMon.classList.toggle('on-air', isOnAir);
}

// ─── PGM VISIBILITY ───────────────────────────────────────────────────────────
// The PGM monitor contains all 6 overlay iframes stacked. We explicitly control
// which one is visible so we never rely on iframe transparency stacking behaviour.
function renderPGMVisibility() {
  OVERLAYS.forEach(function(o) {
    var frame = document.getElementById('pgm-frame-' + o.key);
    if (!frame) return;
    var isLive = o.pgmKeys.some(function(f) { return !!liveState[f]; });
    frame.style.visibility = isLive ? 'visible' : 'hidden';
  });
}

// ─── OVERLAY BUTTONS ─────────────────────────────────────────────────────────
function renderOvlButtons() {
  OVERLAYS.forEach(function(o) {
    var btn = document.querySelector('.ovl-btn[data-key="' + o.key + '"]');
    if (!btn) return;
    var isLive = o.pgmKeys.some(function(f) { return !!liveState[f]; });
    btn.classList.toggle('live',     isLive);
    btn.classList.toggle('selected', pvwSelection === o.key);
  });
}

// ─── PVW IFRAME INJECTION ─────────────────────────────────────────────────────
function injectPVWOverride(frame, flags) {
  try {
    var cw = frame.contentWindow;
    if (!cw || typeof cw.onStateUpdate !== 'function') return;
    if (!frame._origUpdate) frame._origUpdate = cw.onStateUpdate;
    var orig = frame._origUpdate;
    cw.onStateUpdate = function(d) {
      var p = Object.assign({}, d);
      flags.forEach(function(f) { p[f] = true; });
      orig.call(cw, p);
    };
  } catch(e) {}
}
function refreshPVW(frame, flags) {
  injectPVWOverride(frame, flags);
  try {
    if (frame.contentWindow && typeof frame.contentWindow.onStateUpdate === 'function') {
      frame.contentWindow.onStateUpdate(Object.assign({}, liveState));
    }
  } catch(e) {}
}

// ─── OVERLAY SELECTOR ─────────────────────────────────────────────────────────
function selectPVW(key) {
  pvwSelection = key;

  OVERLAYS.forEach(function(o) {
    var f = document.getElementById('pvw-frame-' + o.key);
    if (f) f.style.visibility = (o.key === key) ? 'visible' : 'hidden';
  });

  document.getElementById('pvw-empty').style.display = key ? 'none' : 'flex';

  var ovl = OVERLAYS.find(function(o) { return o.key === key; });
  var cur = document.getElementById('pvw-current');
  if (cur) { cur.textContent = ovl ? ovl.label : '—'; cur.className = 'monitor-current' + (key ? ' active' : ''); }

  renderOvlButtons();

  if (key && ovl) {
    var frame = document.getElementById('pvw-frame-' + key);
    if (frame && frame._ready) refreshPVW(frame, ovl.pvwFlags);
  }

  updateTakeBtn();
  renderCtrlPanel();
}

// ─── TAKE BUTTON STATE ────────────────────────────────────────────────────────
function updateTakeBtn() {
  document.getElementById('take-btn').classList.toggle('ready', pvwSelection !== null);
}

// ─── TAKE — transition PVW selection to live PGM ─────────────────────────────
async function take() {
  if (!pvwSelection) return;
  var ovl = OVERLAYS.find(function(o) { return o.key === pvwSelection; });
  if (!ovl) return;

  var payload = {};
  ALL_FLAGS.forEach(function(f) { payload[f] = false; });
  ovl.pvwFlags.forEach(function(f) { payload[f] = true; });

  var btn = document.getElementById('take-btn');
  btn.disabled = true;
  try {
    var r = await fetch('/update', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload), credentials: 'include',
    });
    if (r.status === 401 || r.status === 403 || (r.redirected && r.url.indexOf('login') !== -1)) {
      document.getElementById('auth-notice').classList.add('visible');
      showStatus('Login required — see link below', false);
    } else if (r.ok) {
      document.getElementById('auth-notice').classList.remove('visible');
      Object.assign(liveState, payload);
      renderPGMStatus();
      renderPGMVisibility();
      renderOvlButtons();
      showStatus('Taken live — ' + ovl.label, true);
    } else {
      showStatus('Server error (' + r.status + ')', false);
    }
  } catch(e) {
    showStatus('Network error', false);
  } finally {
    btn.disabled = false;
  }
}

// ─── CLEAN / CUT — clear all live overlays ───────────────────────────────────
// CUT is a hard cut to clean (remove all on-air graphics immediately).
// CLEAN is the deliberate safety button — same operation.
async function goClean() {
  var payload = {};
  ALL_FLAGS.forEach(function(f) { payload[f] = false; });
  try {
    var r = await fetch('/update', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload), credentials: 'include',
    });
    if (r.ok) {
      Object.assign(liveState, payload);
      renderPGMStatus();
      renderPGMVisibility();
      renderOvlButtons();
      showStatus('Clean — all overlays off', true);
    } else if (r.status === 401 || r.status === 403) {
      document.getElementById('auth-notice').classList.add('visible');
      showStatus('Login required', false);
    } else {
      showStatus('Error (' + r.status + ')', false);
    }
  } catch(e) {
    showStatus('Network error', false);
  }
}

// ─── STATUS BAR ───────────────────────────────────────────────────────────────
function showStatus(msg, ok) {
  var el   = document.getElementById('status-text');
  var time = document.getElementById('status-time');
  el.textContent = msg;
  el.className   = ok ? 'status-ok' : 'status-err';
  var n = new Date();
  time.textContent = String(n.getHours()).padStart(2,'0') + ':' +
                     String(n.getMinutes()).padStart(2,'0') + ':' +
                     String(n.getSeconds()).padStart(2,'0');
}

// ─── SCALE — fit 1920×1080 iframe into the monitor body ──────────────────────
// Uses Math.min(scaleByWidth, scaleByHeight) so the content fits in both
// dimensions, then centers it. Black bars fill any unused space.
function applyScale() {
  var pvwBody = document.getElementById('pvw-body');
  if (!pvwBody) return;
  var W = pvwBody.offsetWidth;
  var H = pvwBody.offsetHeight;
  if (!W || !H) return;
  var scale = Math.min(W / 1920, H / 1080);
  var tx    = Math.max(0, (W - 1920 * scale) / 2);
  var ty    = Math.max(0, (H - 1080 * scale) / 2);
  var xform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  document.querySelectorAll('.ovl-frame').forEach(function(el) {
    el.style.transform = xform;
  });
}
window.addEventListener('resize', function() {
  clearTimeout(window._scaleTimer);
  window._scaleTimer = setTimeout(applyScale, 40);
});

// ─── INLINE OVERLAY CONTROLS ──────────────────────────────────────────────────
// Contextual quick-controls for each overlay type. These affect shared state
// (categories, display count, H2H athletes) but changes are staged in PVW
// before going live on TAKE.
function getCats() {
  var cats = liveState.categories || [];
  return cats.map(function(c) { return (typeof c === 'string') ? c : (c.name || ''); }).filter(Boolean);
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCtrlPanel() {
  var panel = document.getElementById('ctrl-panel');
  if (!panel) return;
  var html = '';
  if      (pvwSelection === 'leaderboard') html = buildLbCtrls();
  else if (pvwSelection === 'lineup')      html = buildLineupCtrls();
  else if (pvwSelection === 'h2h')         html = buildH2HCtrls();
  panel.innerHTML = html;
  panel.classList.toggle('open', !!html);
  // Re-scale because ctrl panel changes monitors-section height
  setTimeout(applyScale, 10);
}

function buildLbCtrls() {
  var cats  = getCats();
  var cur   = liveState.lbCategory || (cats[0] || '');
  var count = liveState.lbDisplayCount || 8;
  var frozen = !!liveState.lbFrozen;

  var catOpts = cats.length
    ? cats.map(function(c) {
        return '<option value="' + esc(c) + '"' + (c === cur ? ' selected' : '') + '>' + esc(c) + '</option>';
      }).join('')
    : '<option>—</option>';

  var countBtns = [5,8,10,15].map(function(n) {
    return '<button class="ctrl-btn' + (count === n ? ' active' : '') + '" onclick="ctrlLbCount(' + n + ')">' + n + '</button>';
  }).join('');

  return '<span class="ctrl-label">Category</span>' +
    '<select class="ctrl-select" onchange="ctrlLbCat(this.value)">' + catOpts + '</select>' +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Rows</span>' + countBtns +
    '<span class="ctrl-sep"></span>' +
    '<button class="ctrl-btn' + (frozen ? ' active' : '') + '" onclick="ctrlLbFreeze()">' +
      (frozen ? '⏸ Frozen' : 'Freeze') +
    '</button>';
}

function buildLineupCtrls() {
  var cats = getCats();
  var idx  = typeof liveState.lineupIndex === 'number' ? liveState.lineupIndex : 0;
  var dur  = liveState.lineupDuration || 5;
  var auto = liveState.lineupAuto !== false;

  var catBtns = cats.map(function(c, i) {
    return '<button class="ctrl-btn' + (i === idx ? ' active' : '') + '" onclick="ctrlLineupIdx(' + i + ')">' + esc(c) + '</button>';
  }).join('');
  if (!catBtns) catBtns = '<span class="ctrl-label" style="opacity:0.5">No categories</span>';

  var durOpts = [3,5,8,10,15].map(function(n) {
    return '<option value="' + n + '"' + (dur === n ? ' selected' : '') + '>' + n + 's</option>';
  }).join('');

  return '<span class="ctrl-label">Category</span>' + catBtns +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Duration</span>' +
    '<select class="ctrl-select" onchange="ctrlLineupDur(this.value)">' + durOpts + '</select>' +
    '<button class="ctrl-btn' + (auto ? ' active' : '') + '" onclick="ctrlLineupAuto()">' + (auto ? 'Auto' : 'Manual') + '</button>';
}

function buildH2HCtrls() {
  var left  = (liveState.h2hLeft  || {}).name || '';
  var right = (liveState.h2hRight || {}).name || '';
  return '<span class="ctrl-label">Left</span>' +
    '<input class="ctrl-input" type="text" placeholder="Athlete name" value="' + esc(left)  + '" onchange="ctrlH2H(\'left\',this.value)">' +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Right</span>' +
    '<input class="ctrl-input" type="text" placeholder="Athlete name" value="' + esc(right) + '" onchange="ctrlH2H(\'right\',this.value)">';
}

// Control action helpers
async function postUpdate(obj) {
  try {
    var r = await fetch('/update', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(obj), credentials:'include'
    });
    if (r.ok) {
      Object.assign(liveState, obj);
      renderCtrlPanel(); renderOvlButtons(); renderPGMStatus(); renderPGMVisibility();
    } else if (r.status === 401 || r.status === 403) {
      document.getElementById('auth-notice').classList.add('visible');
      showStatus('Login required', false);
    } else {
      showStatus('Error ' + r.status, false);
    }
  } catch(e) { showStatus('Network error', false); }
}

async function ctrlLbCat(cat) {
  try {
    var r = await fetch('/director/lb', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({lbCategory: cat}), credentials:'include'
    });
    if (r.ok) { liveState.lbCategory = cat; renderCtrlPanel(); }
  } catch(e) { showStatus('Network error', false); }
}
function ctrlLbCount(n)   { postUpdate({lbDisplayCount: n}); }
function ctrlLbFreeze()   { postUpdate({lbFrozen: !liveState.lbFrozen}); }
function ctrlLineupIdx(i) { postUpdate({lineupIndex: i}); }
function ctrlLineupDur(n) { postUpdate({lineupDuration: parseInt(n,10)}); }
function ctrlLineupAuto() { postUpdate({lineupAuto: liveState.lineupAuto === false ? true : false}); }
function ctrlH2H(side, val) {
  var key = side === 'left' ? 'h2hLeft' : 'h2hRight';
  var obj = Object.assign({}, liveState[key] || {});
  obj.name = val;
  var payload = {}; payload[key] = obj;
  postUpdate(payload);
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  var tag = (e.target || {}).tagName || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); take(); }
  if (e.key === 'Escape') { e.preventDefault(); goClean(); }
});

// ─── BUILD IFRAMES AND SELECTOR BUTTONS ──────────────────────────────────────
(function init() {
  var pvwScreen  = document.getElementById('pvw-screen');
  var pgmScreen  = document.getElementById('pgm-screen');
  var selectorEl = document.getElementById('ovl-selector');

  OVERLAYS.forEach(function(ovl) {
    var src = ovl.src + Q;

    // PVW iframe — hidden until selected; injection on load forces overlay visible
    var pvwFrame         = document.createElement('iframe');
    pvwFrame.id          = 'pvw-frame-' + ovl.key;
    pvwFrame.className   = 'ovl-frame pvw-frame';
    pvwFrame.src         = src;
    pvwFrame._ready      = false;
    pvwFrame._origUpdate = null;
    pvwFrame.addEventListener('load', (function(frame, o) {
      return function() {
        frame._ready = true;
        if (pvwSelection === o.key) refreshPVW(frame, o.pvwFlags);
      };
    }(pvwFrame, ovl)));
    pvwScreen.appendChild(pvwFrame);

    // PGM iframe — starts hidden; renderPGMVisibility() shows the live one
    var pgmFrame       = document.createElement('iframe');
    pgmFrame.id        = 'pgm-frame-' + ovl.key;
    pgmFrame.className = 'ovl-frame pgm-frame';
    pgmFrame.src       = src;
    pgmScreen.appendChild(pgmFrame);

    // Selector button
    var btn = document.createElement('button');
    btn.className   = 'ovl-btn';
    btn.dataset.key = ovl.key;
    btn.textContent = ovl.label;
    btn.addEventListener('click', (function(key) {
      return function() { selectPVW(key); };
    }(ovl.key)));
    selectorEl.appendChild(btn);
  });

  setTimeout(applyScale, 80);
  fetchState();
  connect();
}());
</script>
</body>
