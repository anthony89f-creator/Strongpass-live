<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Broadcast Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
/* ── RESET + TOKENS ─────────────────────────────────────────────────────── */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --green:       #00AA44;
  --green-bright:#00DD55;
  --red:         #BB1E00;
  --red-mid:     #DD2D0D;
  --red-bright:  #FF4422;
  --gold:        #D4A017;
  --gold-light:  #F5C842;
  --bg:          #060606;
  --panel:       #0B0B0B;
  --rail:        #080808;
  --surface:     #0F0F0F;
  --surface2:    #131313;
  --surface3:    #171717;
  --border:      rgba(255,255,255,0.10);
  --border-hi:   rgba(255,255,255,0.22);
  --text:        #EFEFEF;
  --dim:         rgba(255,255,255,0.55);
  --dim2:        rgba(255,255,255,0.28);
}

/* ── VIEWPORT LOCK ──────────────────────────────────────────────────────── */
/* Director is a fullscreen operator panel — no page scroll */
html { height: 100%; }
body {
  height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  display: flex; flex-direction: column;
  overscroll-behavior: none;
}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
.header {
  height: 46px; flex-shrink: 0;
  background: var(--surface); border-bottom: 2px solid rgba(212,160,23,0.25);
  padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 200;
}
.header-left  { display:flex; align-items:center; gap:10px; }
.back-link {
  background: var(--surface2); border: 1px solid var(--border-hi); border-radius: 3px;
  padding: 5px 11px; font-size: 10px; font-weight: 800; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--dim); text-decoration: none;
  transition: color 0.12s, border-color 0.12s; white-space: nowrap;
}
.back-link:hover { color: var(--text); border-color: rgba(255,255,255,0.35); }
.header-logo  { height: 28px; width: auto; object-fit: contain; mix-blend-mode: lighten; opacity: 0.85; }
.header-title { font-size: 15px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; color: #fff; line-height: 1; }
.header-sub   { font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.45); font-family: 'Barlow', sans-serif; margin-top: 2px; }
.conn-wrap    { display:flex; align-items:center; gap:6px; }
.conn-dot     { width:6px; height:6px; border-radius:50%; background:#1e1e1e; flex-shrink:0; }
.conn-dot.ok  { background:var(--green-bright); }
.conn-text    { font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); font-family:'Barlow',sans-serif; }

/* ── MAIN LAYOUT ────────────────────────────────────────────────────────── */
/* Fills remaining viewport after header. No scroll. */
.main {
  flex: 1; min-height: 0;
  padding: 5px 9px 6px;
  display: flex; flex-direction: column; gap: 4px;
  overflow: hidden;
}

/* ── COMP STRIP ─────────────────────────────────────────────────────────── */
.comp-strip {
  flex-shrink: 0; height: 24px;
  display: flex; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  padding: 0 10px; overflow: hidden;
}
.ctx-item {
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,0.45); font-family:'Barlow',sans-serif; white-space:nowrap; padding: 0 6px;
}
.ctx-item:first-child { padding-left:0; color:var(--text); font-size:14px; font-weight:900; }
.ctx-sep { color:rgba(255,255,255,0.18); font-size:10px; }

/* ── MONITORS SECTION ───────────────────────────────────────────────────── */
.monitors-section {
  flex-shrink: 0;
  display: flex; align-items: stretch;
  background: var(--rail);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 3px; overflow: hidden;
}

/* ── MONITOR PANE ───────────────────────────────────────────────────────── */
.monitor {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--panel);
}

/* Colored identity rail */
.pvw-monitor { border-top: 3px solid var(--gold); }
.pgm-monitor {
  border-top: 3px solid var(--red);
  box-shadow: inset 0 0 0 0 transparent;
  transition: box-shadow 0.25s ease;
}
/* On-air tally glow — activated when any overlay is live */
.pgm-monitor.on-air {
  box-shadow: inset 0 0 0 1px rgba(187,30,0,0.22);
}

/* Label bars */
.monitor-head {
  flex-shrink: 0; height: 28px; padding: 0 10px;
  display: flex; align-items: center; gap: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  transition: background 0.25s ease;
}
.pgm-monitor.on-air .monitor-head { background: rgba(187,30,0,0.06); }

.mon-ind { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.pvw-ind { background: rgba(212,160,23,0.6); }
/* Dot is dim when nothing is live; pulse only activates on on-air */
.pgm-ind { background: rgba(255,68,34,0.25); transition: background 0.3s; }
.pgm-monitor.on-air .pgm-ind { background: var(--red-bright); animation: live-pulse 1s ease-in-out infinite; }
@keyframes live-pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.mon-label {
  font-size: 11px; font-weight: 900; letter-spacing: 0.28em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; line-height: 1;
}
.pvw-monitor .mon-label { color: rgba(212,160,23,0.85); }
.pgm-monitor .mon-label { color: rgba(255,68,34,0.85); }

/* Badge is hidden when clean; only shown when on-air class is active */
.live-badge {
  display: none;
  font-size: 8px; font-weight: 900; letter-spacing: 0.18em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: var(--red-bright);
  background: rgba(187,30,0,0.1); border: 1px solid rgba(187,30,0,0.2);
  padding: 2px 5px; border-radius: 2px;
}
.pgm-monitor.on-air .live-badge { display: inline-block; }

/* 16:9 — width is set by flex, height follows via aspect-ratio */
.monitor-body {
  position: relative;
  background: #010101;
  flex-shrink: 0;
  aspect-ratio: 16 / 9;
}
.monitor-screen {
  position: absolute; inset: 0;
  overflow: hidden;
}
/* Recessed screen vignette */
.monitor-screen::after {
  content: ''; position: absolute; inset: 0;
  pointer-events: none; z-index: 50;
  box-shadow: inset 0 0 24px rgba(0,0,0,0.6);
}

/* Overlay iframes — native 1920×1080, positioned and scaled by JS */
.ovl-frame {
  position: absolute; top: 0; left: 0;
  width: 1920px; height: 1080px;
  transform-origin: top left;
  border: none; pointer-events: none;
  background: transparent; /* critical: Safari treats iframes as opaque without this */
}
.pvw-frame { visibility: hidden; } /* JS shows only the selected one */
.pgm-frame { visibility: hidden; } /* _createPGMGroupFrame sets visibility:visible inline; renderPGMVisibility() called after TAKE/CUT/CLN as defence */

/* Empty placeholder when no PVW selection */
.monitor-empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  color: rgba(255,255,255,0.09);
}
.monitor-empty-icon  { font-size: 20px; line-height: 1; }
.monitor-empty-label { font-size: 8px; font-weight: 700; letter-spacing: 0.36em; text-transform: uppercase; font-family:'Barlow',sans-serif; }

/* PGM clean state label */
.pgm-clean {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; letter-spacing: 0.56em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.07);
}
.pgm-clean.visible { display: flex; }

/* Source label footer */
.monitor-foot {
  flex-shrink: 0; height: 20px; padding: 0 10px;
  display: flex; align-items: center; gap: 6px;
  border-top: 1px solid rgba(255,255,255,0.04);
}
.mfoot-tag {
  font-size: 10px; font-weight: 900; letter-spacing: 0.28em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.18); flex-shrink: 0;
}
/* className set by JS: 'monitor-current' or 'monitor-current active' */
.monitor-current {
  font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pvw-monitor .monitor-current.active { color: var(--gold-light); }
.pgm-monitor .monitor-current.active { color: var(--red-mid); font-weight: 800; }

/* ── TRANSITION SPINE ───────────────────────────────────────────────────── */
/* The control column between PVW and PGM */
.transition-col {
  width: 92px; flex-shrink: 0;
  background: var(--rail);
  border-left:  1px solid rgba(255,255,255,0.07);
  border-right: 1px solid rgba(255,255,255,0.07);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 12px 6px; gap: 5px;
}
.t-eyebrow {
  font-size: 8px; font-weight: 900; letter-spacing: 0.32em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.22); margin-bottom: 5px;
}
.t-sep { width: 44px; height: 1px; background: rgba(255,255,255,0.08); margin: 3px 0; }

#take-btn {
  width: 74px; padding: 18px 0 14px;
  border-radius: 3px; border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.38);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase;
  cursor: pointer; transition: background 0.14s, border-color 0.14s, color 0.14s, box-shadow 0.14s;
  -webkit-user-select: none; user-select: none;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
#take-btn::after {
  content: '↵ ENTER';
  font-size: 7px; font-weight: 700; letter-spacing: 0.08em;
  font-family: 'Barlow', sans-serif; opacity: 0.45; text-transform: uppercase;
}
#take-btn.ready {
  background: rgba(0,90,35,0.35);
  border-color: rgba(0,200,80,0.65);
  color: var(--green-bright);
  box-shadow: 0 0 16px rgba(0,180,60,0.12);
}
#take-btn.ready:hover  { background: rgba(0,110,42,0.52); border-color: var(--green); }
#take-btn:active       { transform: scale(0.95); }
#take-btn:disabled     { opacity: 0.4; cursor: not-allowed; transform: none; }

/* CUT = cut current PGM overlay to clean */
#cut-btn {
  width: 74px; padding: 11px 0 9px;
  border-radius: 3px; border: 1px solid rgba(255,255,255,0.14);
  background: transparent; color: rgba(255,255,255,0.55);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase;
  cursor: pointer; transition: all 0.1s;
  -webkit-user-select: none; user-select: none;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
#cut-btn::after {
  content: 'ESC';
  font-size: 7px; font-weight: 700; letter-spacing: 0.08em;
  font-family: 'Barlow', sans-serif; opacity: 0.45; text-transform: uppercase;
}
#cut-btn:hover:not(:disabled)  { border-color: var(--border-hi); color: rgba(255,255,255,0.8); }
#cut-btn:active:not(:disabled) { transform: scale(0.96); }
#cut-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.auto-btn {
  width: 74px; padding: 8px 0;
  border-radius: 3px; border: 1px solid rgba(255,255,255,0.06);
  background: transparent; color: rgba(255,255,255,0.15);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  cursor: default;
}

#clean-btn {
  width: 74px; padding: 11px 0;
  border-radius: 3px; border: 1px solid rgba(180,0,0,0.3);
  background: rgba(100,0,0,0.08); color: rgba(220,80,80,0.7);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; transition: all 0.1s;
  -webkit-user-select: none; user-select: none;
}
#clean-btn:hover  { border-color: rgba(220,0,0,0.5); color: rgba(255,100,100,0.9); background: rgba(130,0,0,0.12); }
#clean-btn:active { transform: scale(0.96); }

/* ── OVERLAY SELECTOR ───────────────────────────────────────────────────── */
.ovl-selector-wrap {
  flex-shrink: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  padding: 7px 9px;
}
.ovl-selector-label {
  font-size: 9px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.45); margin-bottom: 7px;
}
.ovl-selector { display:flex; gap:5px; }
.ovl-btn {
  flex: 1; padding: 13px 8px;
  border-radius: 3px; border: 1px solid var(--border-hi); background: var(--surface3);
  color: rgba(255,255,255,0.6);
  font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 800;
  letter-spacing: 0.07em; text-transform: uppercase;
  cursor: pointer; transition: all 0.1s; position: relative; white-space: nowrap;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.ovl-btn:hover  { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.9); }
.ovl-btn:active { transform: scale(0.97); }
.ovl-btn.selected {
  background: rgba(212,160,23,0.09); border-color: rgba(212,160,23,0.55); color: var(--gold-light);
}
/* Red pip = live on PGM */
.ovl-btn.live::after {
  content: ''; position: absolute; top: 5px; right: 5px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--red-bright);
}
/* Group badge — bottom-left corner of each overlay button */
.ovl-btn::before {
  content: attr(data-group);
  position: absolute; bottom: 3px; left: 5px;
  font-size: 7px; font-weight: 900; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.25); font-family: 'Barlow', sans-serif;
  pointer-events: none;
}

/* ── GROUP STATUS STRIP ──────────────────────────────────────────────────── */
.group-strip {
  flex-shrink: 0; height: 22px;
  display: flex; align-items: stretch; gap: 3px;
}
.grp-pill {
  display: flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid rgba(255,255,255,0.07); border-radius: 2px;
  padding: 0 10px; min-width: 80px;
  opacity: 0.5; transition: opacity 0.2s, background 0.2s, border-color 0.2s;
}
.grp-pill.live {
  background: rgba(187,30,0,0.1);
  border-color: rgba(187,30,0,0.4);
  opacity: 1;
}
.grp-pill-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,0.2); flex-shrink: 0;
}
.grp-pill.live .grp-pill-dot { background: var(--red-bright); }
.grp-pill-label {
  font-size: 9px; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(255,255,255,0.45); font-family: 'Barlow', sans-serif; white-space: nowrap;
}
.grp-pill.live .grp-pill-label { color: rgba(255,255,255,0.75); }
.grp-pill-name {
  font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: rgba(255,255,255,0.35); font-family: 'Barlow Condensed', sans-serif;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.grp-pill.live .grp-pill-name { color: var(--red-mid); }

/* ── CONTEXTUAL OVERLAY PROPERTY PANEL ─────────────────────────────────── */
.ctrl-panel {
  flex-shrink: 0; display: none;
}
.ctrl-panel.open {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  padding: 6px 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
}
.cp-head {
  flex-shrink: 0; height: 28px; padding: 0 10px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface2); border-bottom: 1px solid var(--border);
}
.cp-head-title {
  font-size: 9px; font-weight: 900; letter-spacing: 0.28em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.5);
}
.cp-body {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 10px; display: flex; flex-direction: column; gap: 10px;
}
.cp-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  color: rgba(255,255,255,0.12);
}
.cp-empty-icon  { font-size: 20px; }
.cp-empty-label { font-size: 8px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; font-family: 'Barlow', sans-serif; }
.cp-section {
  background: var(--surface2); border: 1px solid var(--border-hi); border-radius: 3px;
  padding: 9px 11px; display: flex; flex-direction: column; gap: 8px;
}
.cp-section-title {
  font-size: 8px; font-weight: 900; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(255,255,255,0.38); font-family: 'Barlow', sans-serif;
}
.cp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cp-row.single { grid-template-columns: 1fr; }
.cp-row.three  { grid-template-columns: 1fr 1fr 1fr; }
.cp-field { display: flex; flex-direction: column; gap: 3px; }
.cp-label {
  font-size: 8px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(255,255,255,0.42); font-family: 'Barlow', sans-serif;
}
.cp-input {
  background: var(--surface3); border: 1px solid var(--border-hi); border-radius: 2px;
  color: var(--text); font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 700; padding: 7px 9px; width: 100%; outline: none;
}
.cp-input:focus { border-color: rgba(212,160,23,0.5); }
.cp-select {
  background: var(--surface3); border: 1px solid var(--border-hi); border-radius: 2px;
  color: var(--text); font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 700; padding: 7px 9px; cursor: pointer; outline: none; width: 100%;
}
.cp-select:focus { border-color: rgba(212,160,23,0.4); }
.cp-btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.cp-btn {
  background: var(--surface3); border: 1px solid var(--border-hi); border-radius: 2px;
  color: rgba(255,255,255,0.55); font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 6px 12px; cursor: pointer; transition: all 0.1s;
  -webkit-user-select: none; user-select: none;
}
.cp-btn:hover  { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.85); }
.cp-btn:active { transform: scale(0.97); }
.cp-btn.active { background: rgba(212,160,23,0.1); border-color: rgba(212,160,23,0.45); color: var(--gold-light); }
.cp-btn.danger { border-color: rgba(180,0,0,0.28); color: rgba(220,80,80,0.7); }
.cp-btn.danger:hover { border-color: rgba(220,0,0,0.5); color: rgba(255,110,110,0.95); }
.cp-btn.push { background: rgba(0,90,35,0.2); border-color: rgba(0,185,75,0.45); color: var(--green-bright); }
.cp-btn.push:hover { background: rgba(0,110,42,0.35); border-color: var(--green); }
.cp-divider { height: 1px; background: rgba(255,255,255,0.07); }

/* ctrl-* classes used by ctrlBuilder JS functions */
.ctrl-label {
  font-size: 10px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
  font-family: 'Barlow', sans-serif; color: rgba(255,255,255,0.55); white-space: nowrap; flex-shrink: 0;
}
.ctrl-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.12); flex-shrink: 0; }
.ctrl-select {
  background: var(--surface3); border: 1px solid var(--border-hi); border-radius: 2px;
  color: var(--text); font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 700; padding: 4px 8px; cursor: pointer; outline: none;
}
.ctrl-select:focus { border-color: rgba(212,160,23,0.4); }

.ctrl-btn {
  background: var(--surface3); border: 1px solid var(--border-hi); border-radius: 2px;
  color: rgba(255,255,255,0.60); font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 5px 11px; cursor: pointer; transition: all 0.1s; flex-shrink: 0;
  -webkit-user-select: none; user-select: none;
}
.ctrl-btn:hover  { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.85); }
.ctrl-btn:active { transform: scale(0.97); }
.ctrl-btn.active {
  background: rgba(212,160,23,0.08); border-color: rgba(212,160,23,0.38); color: var(--gold-light);
}
.ctrl-btn.danger       { border-color: rgba(180,0,0,0.2); color: rgba(220,70,70,0.55); }
.ctrl-btn.danger:hover { border-color: rgba(220,0,0,0.4); color: rgba(255,80,80,0.8); }
.ctrl-input {
  background: var(--surface3); border: 1px solid var(--border); border-radius: 2px;
  color: var(--text); font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 700; padding: 4px 8px; width: 140px; outline: none;
}
.ctrl-input:focus { border-color: rgba(212,160,23,0.35); }

/* ── AUTH + STATUS ──────────────────────────────────────────────────────── */
.auth-notice {
  flex-shrink: 0; display: none; align-items: center; gap: 10px;
  padding: 6px 12px;
  background: rgba(130,0,0,0.06); border: 1px solid rgba(130,0,0,0.2); border-radius: 2px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  color: rgba(255,110,110,0.85); font-family: 'Barlow', sans-serif;
}
.auth-notice a { color: rgba(255,150,150,0.9); text-decoration: underline; font-weight: 700; }
.auth-notice.visible { display: flex; }

.status-bar {
  flex-shrink: 0; height: 24px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
  color: var(--dim); font-family: 'Barlow', sans-serif;
}
.status-ok  { color: var(--green-bright); }
.status-err { color: #FF4444; }
.status-time { opacity: 0.35; font-variant-numeric: tabular-nums; }

/* ── RUNTIME HUD — debug mode only (press D to show) ────────────────────── */
#runtime-hud {
  position:fixed; top:6px; right:8px; z-index:9999;
  display:none;
  background:rgba(0,0,0,0.92); color:#ffe84d;
  font:9px/1.5 'Courier New',monospace; letter-spacing:0;
  padding:5px 8px; border:1px solid rgba(255,232,77,0.3); border-radius:2px;
  pointer-events:none; white-space:pre; min-width:180px;
}
#runtime-hud.on { display:block; }

/* ── PVW SCALE DEBUG HUD (toggle: press D key) ──────────────────────────── */
#pvw-dbg-hud {
  position:absolute; bottom:3px; left:3px; z-index:200;
  display:none; /* JS adds class 'on' to show */
  background:rgba(0,0,0,0.93); color:#00ff88;
  font:8px/1.55 'Courier New',monospace; letter-spacing:0;
  padding:5px 7px; border:1px solid rgba(0,255,136,0.25); border-radius:2px;
  pointer-events:none; white-space:pre;
}
#pvw-dbg-hud.on { display:block; }

/* ── RESPONSIVE ─────────────────────────────────────────────────────────── */
@media (max-width: 800px) {
  .monitors-section { flex-direction: column; }
  .transition-col {
    width: 100%; height: 52px; flex-direction: row;
    border-left: none; border-right: none;
    border-top: 1px solid rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    justify-content: center;
  }
  .t-eyebrow { display: none; }
  .t-sep { width: 1px; height: 26px; margin: 0 3px; }
}

<body>

<!-- ── HEADER ──────────────────────────────────────────────────────────────── -->
<div class="header">

<div class="main">

  <div class="status-bar">
    <span id="status-text">Ready</span>
    <span id="status-time" class="status-time"></span>
  </div>

</div><!-- /main -->

<script>
// ─── BUILD ID — proof that this exact source is running ──────────────────────
// Change this value manually whenever you deploy to verify runtime matches file.
var BUILD_ID = 'BUILD-20260519-B';
var DEBUG    = /[?&]debug=1/.test(location.search);
document.title = 'Director [' + BUILD_ID + ']';
(function() {
  // Stamp build ID into header-sub so it's always visible, even after SSE connects.
  var sub = document.getElementById('header-sub');
  if (sub) sub.textContent = BUILD_ID;
  // Log immediately — if this doesn't appear in console the file is not being served
  console.log('%c[Director BOOT] BUILD_ID=' + BUILD_ID + ' url=' + location.href,
              'background:#1a1a00;color:#ffe84d;font-weight:bold;padding:2px 6px');
}());

// ─── CONFIG ───────────────────────────────────────────────────────────────────
var _token = new URLSearchParams(window.location.search).get('token') || '';
var Q      = _token ? ('?token=' + encodeURIComponent(_token)) : '';
// PVW query string — ?pvw=1 disables sse-client.js inside the overlay iframe.
// Token appended if present.
var QPVW   = _token ? ('?pvw=1&token=' + encodeURIComponent(_token)) : '?pvw=1';

// Overlay definitions.
// pvwFlags:      visibility flags forced to true when injecting state into PVW iframe.
// pgmKeys:       flags read from liveState to determine on-air status.
// pvwDrop:       liveState fields to omit from postMessage payload for this overlay.
// hasControls:   true if this overlay has a ctrl panel in the director.
// ctrlStateKeys: liveState fields that drive the ctrl panel dirty-check for this overlay.
// ctrlBuilder:   function() → HTML string; called by renderCtrlPanel when dirty-check misses.
// Groups enforce mutual exclusion: A=full-frame, B=lower-slot, C=data-strip.
// Multiple groups can be live simultaneously — one overlay per group at most.
var OVERLAYS = [
  { key:'leaderboard', label:'Leaderboard',   src:'/leaderboard.html', group:'A', hasControls:true,  ctrlStateKeys:['lbCategory','lbDisplayCount','lbFrozen','categories'],   ctrlBuilder:buildLbCtrls,    pvwFlags:['leaderboard'],                  pgmKeys:['leaderboard'] },
  { key:'h2h',         label:'Head To Head',  src:'/h2h.html',         group:'A', hasControls:true,  ctrlStateKeys:['h2hLeft','h2hRight'],                                    ctrlBuilder:buildH2HCtrls,   pvwDrop:['athletes'], pvwFlags:['h2h'],     pgmKeys:['h2h'] },
  { key:'lineup',      label:'Lineup',        src:'/lineup.html',      group:'A', hasControls:true,  ctrlStateKeys:['lineupIndex','lineupAuto','lineupDuration','categories'], ctrlBuilder:buildLineupCtrls, pvwFlags:['lineup'],                      pgmKeys:['lineup'] },
  { key:'lowerthird',  label:'Lower Third',   src:'/lowerthird.html',       group:'B', hasControls:false,                                                                                                                                pvwDrop:['athletes'], pvwFlags:['lowerThirdVisible'],          pgmKeys:['lowerThirdVisible'] },
  { key:'manuallower', label:'Manual Lower Third', src:'/manual_lowerthird.html', group:'B', hasControls:true, ctrlStateKeys:['manualLine1','manualLine2','manualScore'], ctrlBuilder:buildManualLtCtrls, pvwDrop:['athletes'], pvwFlags:['manualVisible'],              pgmKeys:['manualVisible'] },
  { key:'champion',    label:'Champion',      src:'/champion.html',         group:'B', hasControls:true,  ctrlStateKeys:['champName','champDetail','champScore','champEvents'],                    ctrlBuilder:buildChampCtrls,    pvwDrop:['athletes'], pvwFlags:['champion'],                  pgmKeys:['champion'] },
  { key:'reps',        label:'Reps / Lights', src:'/reps.html',        group:'C', hasControls:false,                                                                                                       pvwDrop:['athletes'], pvwFlags:['repsVisible','lightsVisible'], pgmKeys:['repsVisible','lightsVisible'] },
];

// O(1) overlay lookup by key — avoids repeated OVERLAYS.find() at every transition.
var OVL_BY_KEY = (function() {
  var m = {};
  OVERLAYS.forEach(function(o) { m[o.key] = o; });
  return m;
}());

// ─── INSTRUMENTATION ─────────────────────────────────────────────────────────
var DL = (function() {
  if (!DEBUG) return function() {};
  var t0 = Date.now();
  return function(msg) {
    console.log('[Director +' + (Date.now()-t0) + 'ms] ' + msg);
  };
}());

// ─── LIFECYCLE STAGE TRACKER ─────────────────────────────────────────────────
var _lifecycleStage = 'init';

function _hudUpdate() {
  var el = document.getElementById('runtime-hud');
  if (!el || !el.classList.contains('on')) return;
  var pvwFrames = document.querySelectorAll('.pvw-frame').length;
  var pgmFrames = document.querySelectorAll('.pgm-frame').length;
  el.textContent =
    'BUILD:  ' + BUILD_ID + '\n' +
    'stage:  ' + _lifecycleStage + '\n' +
    'taking: ' + _taking + '\n' +
    'pvwSel: ' + (pvwSelection || '—') + '\n' +
    'pvwFrm: ' + pvwFrames + '  pgmFrm: ' + pgmFrames + '\n' +
    'sse:    ' + (_es ? ['connecting','open','closed'][_es.readyState] || _es.readyState : 'null') + '\n' +
    'debug:  ?debug=1 in URL for verbose logs';
}

function _setLifecycleStage(stage) {
  _lifecycleStage = stage;
  DL('[STAGE] ' + stage);
  _hudUpdate();
}

window.addEventListener('error', function(e) {
  console.error('[Director UNCAUGHT]', e.message, '@', e.filename + ':' + e.lineno);
});
window.addEventListener('unhandledrejection', function(e) {
  console.error('[Director UNHANDLED PROMISE]', e.reason);
});

// ─── STATE ────────────────────────────────────────────────────────────────────
var liveState    = {};
var pvwSelection = null;
var _taking      = false;
var _takingAt    = 0;  // timestamp when _taking became true; watchdog checks duration

// ─── OVERLAY BUTTON CACHE ────────────────────────────────────────────────────
// Populated in init(). Eliminates repeated querySelector in the hot renderOvlButtons path.
var _ovlBtns = {};

// ─── TRANSITION QUEUE ─────────────────────────────────────────────────────────
var _queue      = Promise.resolve();
var _queueSeq   = 0;  // monotonic counter to identify queue slots in logs
function _enqueue(fn) {
  var seq = ++_queueSeq;
  var label = fn.name || 'anonymous';
  DL('[QUEUE] accepted seq=' + seq + ' fn=' + label);
  _queue = _queue.then(
    function() {
      DL('[QUEUE] running seq=' + seq + ' fn=' + label);
      try {
        var ret = fn();
        if (ret && typeof ret.then === 'function') {
          return ret.then(
            function()  { DL('[QUEUE] done seq=' + seq); },
            function(e) { console.error('[QUEUE] fn rejected seq=' + seq, e); }
          );
        }
        DL('[QUEUE] done (sync) seq=' + seq);
      } catch(e) {
        console.error('[QUEUE] fn threw seq=' + seq, e);
      }
    },
    function(e) {
      console.error('[QUEUE] prev-slot rejected before seq=' + seq + ' ran', e);
    }
  );
}

// ─── PVW READY HANDSHAKE ──────────────────────────────────────────────────────
// overlay-ready is now handled per-transition inside _createPVWFrame.
// Each transition installs its own named message listener and removes it after settling.
// No global _pvwReadyResolve — eliminates competing resolve paths.

// ─── SSE — director's own connection ─────────────────────────────────────────
var _es = null, _retryTimer = null, _retryMs = 1000;

function setConn(ok) {
  document.getElementById('conn-dot').className    = 'conn-dot' + (ok ? ' ok' : '');
  document.getElementById('conn-text').textContent = ok ? 'Connected' : 'Disconnected';
  document.getElementById('conn-text').style.color = ok ? 'var(--green-bright)' : '#FF5555';
}
function connect() {
  if (_es) { _es.close(); _es = null; }
  DL('SSE connect → /stream');
  _es = new EventSource('/stream' + Q);
  _es.onopen    = function()  { _retryMs = 1000; setConn(true); DL('SSE open OK'); };
  _es.onmessage = function(e) {
    try { onStateUpdate(JSON.parse(e.data)); }
    catch(err) { console.error('[Director SSE onmessage EXCEPTION]', err); }
  };
  _es.onerror   = function()  {
    DL('SSE error — reconnecting in ' + _retryMs + 'ms');
    setConn(false); _es.close(); _es = null;
    _retryTimer = setTimeout(connect, _retryMs);
    _retryMs    = Math.min(_retryMs * 2, 30000);
  };
}
function disconnect() {
  if (_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; }
  if (_es)         { _es.close(); _es = null; }
}
function fetchState() {
  fetch('/state.json?t=' + Date.now(), { cache:'no-store' })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) { if (d) onStateUpdate(d); })
    .catch(function() {});
}
window.addEventListener('pagehide', disconnect);
window.addEventListener('pageshow', function(e) { if (e.persisted) { connect(); fetchState(); } });
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) { if (!_es) connect(); fetchState(); }
});

// ─── PVW STATE INJECTION ──────────────────────────────────────────────────────
// Compute the state object to inject into a PVW iframe.
// Clones liveState, forces the overlay's pvwFlags to true, all other overlay
// visibility flags to false — so the overlay renders as if it's the only thing
// on air, regardless of actual live state.
var _ALL_OVL_FLAGS = (function() {
  var s = {};
  OVERLAYS.forEach(function(o) { o.pvwFlags.forEach(function(f) { s[f] = true; }); });
  return Object.keys(s);
}());

function pvwStateFor(ovl) {
  var s = Object.assign({}, liveState);
  // Strip large fields not needed for overlay rendering — avoids postMessage
  // structured-clone of 126KB+ results payload on every SSE tick.
  delete s.results;
  // lineup PVW needs lbStandings; leaderboard PVW needs lbAthletes. All others get neither.
  if (ovl.key !== 'lineup')      delete s.lbStandings;
  if (ovl.key !== 'leaderboard') delete s.lbAthletes;
  // Drop per-overlay fields the overlay never renders — avoids cloning ~200 properties per tick.
  (ovl.pvwDrop || []).forEach(function(f) { delete s[f]; });
  _ALL_OVL_FLAGS.forEach(function(f) { s[f] = false; });
  ovl.pvwFlags.forEach(function(f) { s[f] = true; });
  return s;
}

// Send state to a PVW iframe via postMessage.
// The overlay loaded with ?pvw=1 skips sse-client.js and receives state here.
function pushToPVW(ovl) {
  var frame = document.getElementById('pvw-frame-' + ovl.key);
  if (!frame) { DL('pushToPVW ' + ovl.key + ' — frame NOT in DOM'); return; }
  if (!frame.contentWindow) { DL('pushToPVW ' + ovl.key + ' — contentWindow is null (frame not ready?)'); return; }
  try {
    frame.contentWindow.postMessage(pvwStateFor(ovl), '*');
    DL('pushToPVW ' + ovl.key + ' — sent OK');
  } catch(e) { console.error('[Director pushToPVW EXCEPTION]', ovl.key, e); }
}

// Push current liveState to the active PVW frame immediately, without waiting for SSE.
// Called after any ctrl action that mutates liveState, so the overlay preview reflects
// the change right away rather than on the next SSE tick (~100-500ms later).
function _pushCurrentPVW() {
  if (!pvwSelection) return;
  var ovl = OVL_BY_KEY[pvwSelection];
  if (ovl) pushToPVW(ovl);
}

// ─── STATE UPDATE ─────────────────────────────────────────────────────────────
var _sseTickCount = 0;
function onStateUpdate(d) {
  _sseTickCount++;
  var tick = _sseTickCount;
  var incomingScene = d.program ? (d.program.scene || 'null') : '(no program key)';
  DL('onStateUpdate tick=' + tick + ' incoming program.scene=' + incomingScene + ' pvwSelection=' + pvwSelection + ' _taking=' + _taking);
  try {
    Object.assign(liveState, d);
  } catch(e) { console.error('[Director onStateUpdate merge EXCEPTION tick=' + tick + ']', e); return; }
  try { renderCtxStrip(); }   catch(e) { console.error('[Director renderCtxStrip EXCEPTION]', e); }
  try { renderPGMStatus(); }  catch(e) { console.error('[Director renderPGMStatus EXCEPTION]', e); }
  try { renderOvlButtons(); } catch(e) { console.error('[Director renderOvlButtons EXCEPTION]', e); }
  try { renderCtrlPanel(); }  catch(e) { console.error('[Director renderCtrlPanel EXCEPTION]', e); }
  try { renderGroupStrip(); } catch(e) { console.error('[Director renderGroupStrip EXCEPTION]', e); }
  // Push to active PVW via postMessage
  if (pvwSelection) {
    var ovl = OVL_BY_KEY[pvwSelection];
    if (ovl) { try { pushToPVW(ovl); } catch(e) { console.error('[Director pushToPVW from SSE EXCEPTION]', e); } }
  }
  // Reconstruct PGM iframes per group. Primary source: program.groups (server-tracked
  // per-group intent). Fallback: individual overlay flags (for old state.json or
  // states where groups key is absent). Never create more than one frame per group.
  var _programGroups = (liveState.program && liveState.program.groups) || null;

  var pgmChanged = false;
  _PGM_GROUP_ORDER.forEach(function(group) {
    var wantedKey;
    if (_programGroups) {
      wantedKey = _programGroups[group] || null;
    } else {
      // Fallback: first overlay in this group whose flags are true
      var liveOvl = OVERLAYS.find(function(o) {
        return o.group === group && o.pgmKeys.some(function(f) { return !!liveState[f]; });
      });
      wantedKey = liveOvl ? liveOvl.key : null;
    }

    var currentKey = _pgmFrames[group] || null;
    if (wantedKey && currentKey !== wantedKey) {
      var ovl = OVL_BY_KEY[wantedKey];
      if (ovl) {
        DL('onStateUpdate: group=' + group + ' want=' + wantedKey + ' have=' + (currentKey||'none') + ' — creating PGM frame');
        _createPGMGroupFrame(ovl);
        pgmChanged = true;
      }
    } else if (!wantedKey && currentKey) {
      DL('onStateUpdate: group=' + group + ' no longer active — destroying PGM frame');
      _destroyPGMGroup(group);
    }
  });
  if (pgmChanged) applyScale();
}

// ─── CONTEXT STRIP ────────────────────────────────────────────────────────────
// Dirty-check: comp context changes only on heat advance — skip writes on score ticks.
var _lastCtxKey = null;
function renderCtxStrip() {
  var comp  = liveState.compName      || liveState.compEventName || '';
  var event = liveState.compEventName || liveState.eventName     || '';
  var heat  = liveState.compHeat      || '';
  var cat   = liveState.compCategory  || liveState.category      || '';
  var key   = comp + '|' + event + '|' + heat + '|' + cat;
  if (key === _lastCtxKey) return;
  _lastCtxKey = key;
  var set = function(id, v) { var el = document.getElementById(id); if (el) el.textContent = v || '—'; };
  set('ctx-comp',  comp);
  set('ctx-event', event);
  set('ctx-heat',  heat);
  set('ctx-cat',   cat);
}

// ─── PGM STATUS ───────────────────────────────────────────────────────────────
// Derives on-air state from liveState overlay flags (which are kept in sync by
// the server after every /broadcast/take and /broadcast/clean call).
// Dirty-check: on-air state changes only on TAKE/CUT/CLN — skip DOM write on score-only ticks.
var _lastPGMStatusKey = null;
function renderPGMStatus() {
  var statusKey = OVERLAYS.map(function(o) {
    return o.pgmKeys.some(function(f) { return !!liveState[f]; }) ? '1' : '0';
  }).join('');
  if (statusKey === _lastPGMStatusKey) return;
  _lastPGMStatusKey = statusKey;

  var live = OVERLAYS.filter(function(o) {
    return o.pgmKeys.some(function(f) { return !!liveState[f]; });
  });
  var isOnAir = live.length > 0;
  var label   = isOnAir ? live.map(function(o) { return o.label; }).join(' + ') : 'Clean';

  var current = document.getElementById('pgm-current');
  if (current) { current.textContent = label; current.className = 'monitor-current' + (isOnAir ? ' active' : ''); }

  var cleanEl = document.getElementById('pgm-clean');
  if (cleanEl) cleanEl.classList.toggle('visible', !isOnAir);

  var pgmMon = document.getElementById('pgm-monitor');
  if (pgmMon) pgmMon.classList.toggle('on-air', isOnAir);
}

// ─── PGM VISIBILITY ───────────────────────────────────────────────────────────
// All active group frames stay visible. Lifecycle is managed by _createPGMGroupFrame
// and _destroyPGMGroup; this function just ensures any existing frame is shown.
function renderPGMVisibility() {
  document.querySelectorAll('#pgm-screen iframe').forEach(function(f) {
    f.style.visibility = 'visible';
  });
}

// ─── OVERLAY BUTTONS ──────────────────────────────────────────────────────────
var _lastOvlBtnKey = null;
function renderOvlButtons() {
  var key = pvwSelection + '|' + OVERLAYS.map(function(o) {
    return o.pgmKeys.some(function(f) { return !!liveState[f]; }) ? '1' : '0';
  }).join('');
  if (key === _lastOvlBtnKey) return;
  _lastOvlBtnKey = key;
  DL('renderOvlButtons — pvwSelection=' + pvwSelection);
  try {
    OVERLAYS.forEach(function(o) {
      var btn = _ovlBtns[o.key];
      if (!btn) return;
      var isLive = o.pgmKeys.some(function(f) { return !!liveState[f]; });
      btn.classList.toggle('live',     isLive);
      btn.classList.toggle('selected', pvwSelection === o.key);
    });
  } catch(err) {
    console.error('[renderOvlButtons EXCEPTION]', err);
  }
}

// ─── IFRAME MANAGEMENT ────────────────────────────────────────────────────────
// One PVW iframe and one PGM iframe maximum at any time.
// Old frame is destroyed before creating a new one — no hidden iframe pools,
// no accumulated JS runtimes, timers, or SSE connections.

var _pvwKey            = null;  // key of the currently mounted PVW iframe
var _activeTransitionId = 0;    // incremented on every selectPVW click; stale transitions self-cancel

function _destroyPVWFrame() {
  var screen = document.getElementById('pvw-screen');
  var old = screen && screen.querySelector('iframe');
  if (old) {
    DL('_destroyPVWFrame — removing ' + old.id);
    old.src = 'about:blank';  // terminate any in-flight load before remove
    old.remove();
  }
  _pvwKey = null;
}

// _createPVWFrame — two-phase handshake per transition.
//
// Architecture (phase order):
//   1. install message listener BEFORE src set (no race)
//   2. overlay boots, attaches its own listener, defines onStateUpdate
//   3. overlay sends overlay-runtime-ready  ← "I can receive state now"
//   4. director pushes initial state
//   5. overlay calls onStateUpdate + render(), then sends overlay-ready via rAF
//   6. director settles (resolves promise, cleans listeners/timers)
//
// overlay-runtime-ready is the safe synchronization point for state push.
// iframe.onload is NOT safe — overlay scripts may not have run yet on all engines.
//
function _createPVWFrame(ovl, id) {
  _destroyPVWFrame();
  var screen = document.getElementById('pvw-screen');
  if (!screen) {
    console.error('[PVW#' + id + '] pvw-screen not found');
    return Promise.resolve();
  }
  var pvwBody = document.getElementById('pvw-body');
  DL('[PVW#' + id + '] _createPVWFrame BEGIN key=' + ovl.key +
     ' pvwBody=' + (pvwBody ? pvwBody.offsetWidth : 'N/A') + 'x' + (pvwBody ? pvwBody.offsetHeight : 'N/A'));

  var frame       = document.createElement('iframe');
  frame.id        = 'pvw-frame-' + ovl.key;
  frame.className = 'ovl-frame pvw-frame';
  frame.style.visibility = 'visible';
  screen.appendChild(frame);
  _pvwKey = ovl.key;
  DL('[PVW#' + id + '] iframe appended id=' + frame.id);

  return new Promise(function(resolve) {
    var settled    = false;
    var statePushed = false;

    function cleanup() {
      window.removeEventListener('message', onMessage);
      clearTimeout(timeoutHandle);
      clearInterval(cancelPoll);
    }

    function settle(reason) {
      if (settled) return;
      settled = true;
      _setLifecycleStage('[PVW#' + id + '] settled:' + reason);
      DL('[PVW#' + id + '] settle(' + reason + ') — cleanup and resolve');
      cleanup();
      resolve();  // always resolve; selectPVW owns the stale-ID guard
    }

    // Cancel poll: if a newer transition started, resolve immediately.
    var cancelPoll = setInterval(function() {
      if (id !== _activeTransitionId) {
        DL('[PVW#' + id + '] cancel poll — superseded by #' + _activeTransitionId);
        settle('cancelled');
      }
    }, 50);

    // Timeout: overlay never completed handshake. Resolve so queue never permanently deadlocks.
    var timeoutHandle = setTimeout(function() {
      console.warn('[PVW#' + id + '] TIMEOUT 5s — handshake incomplete for ' + ovl.key +
                   ' statePushed=' + statePushed);
      DL('[PVW#' + id + '] TIMEOUT 5s — overlay-ready never received for ' + ovl.key);
      settle('timeout');
    }, 5000);

    // Single message handler for both phases of the handshake.
    // Verifies source by direct contentWindow reference on every message.
    function onMessage(e) {
      if (!e.data || e.source !== frame.contentWindow) return;

      if (e.data.type === 'overlay-runtime-ready') {
        DL('[PVW#' + id + '] runtime-ready received — pushing initial state');
        _setLifecycleStage('[PVW#' + id + '] runtime-ready:' + ovl.key);
        if (!statePushed) {
          statePushed = true;
          try {
            var initialState = pvwStateFor(ovl);
            frame.contentWindow.postMessage(initialState, '*');
            DL('[PVW#' + id + '] initial state pushed — overlay will render then send overlay-ready');
          } catch(pushErr) {
            console.error('[PVW#' + id + '] state push FAILED: ' + pushErr.message);
          }
        } else {
          DL('[PVW#' + id + '] runtime-ready received again — state already pushed, ignoring');
        }
        return;
      }

      if (e.data.type === 'overlay-ready') {
        DL('[PVW#' + id + '] overlay-ready received — statePushed=' + statePushed + ' settled=' + settled);
        if (!statePushed) {
          console.warn('[PVW#' + id + '] overlay-ready before state pushed — overlay may render blank');
        }
        settle('overlay-ready');
      }
    }
    window.addEventListener('message', onMessage);

    // iframe.onload: lifecycle/HUD only — state push happens on overlay-runtime-ready instead.
    frame.addEventListener('load', function() {
      _setLifecycleStage('[PVW#' + id + '] iframe-load:' + ovl.key);
      DL('[PVW#' + id + '] iframe load — contentWindow=' + (!!frame.contentWindow) +
         ' waiting for overlay-runtime-ready before pushing state');
      _dbgUpdateHUD();
    });

    // Set src LAST — listener is already attached above.
    _setLifecycleStage('[PVW#' + id + '] src-set:' + ovl.key);
    frame.src = ovl.src + QPVW;
    DL('[PVW#' + id + '] src set → ' + frame.src);
  });
}

// _pgmFrames: { groupLetter: overlayKey } — one entry per active group (max 3).
// Frames render in group order (A → B → C) so Group C sits on top of Group B on top of A.
var _pgmFrames = {};
var _PGM_GROUP_ORDER = ['A', 'B', 'C'];

function _destroyPGMGroup(group) {
  var old = document.getElementById('pgm-frame-group-' + group);
  if (old) {
    DL('_destroyPGMGroup — removing group=' + group + ' id=' + old.id);
    old.src = 'about:blank';  // terminate SSE inside the frame before removal
    old.remove();
  }
  delete _pgmFrames[group];
}

// Z-index per group ensures correct compositing order regardless of DOM insertion order.
// Group A (full-frame overlays) sits behind B and C; Group C (data strip) is on top.
var _PGM_Z = { A: 10, B: 20, C: 30 };

function _createPGMGroupFrame(ovl) {
  _destroyPGMGroup(ovl.group);
  var screen = document.getElementById('pgm-screen');
  if (!screen) { console.error('[_createPGMGroupFrame] pgm-screen not found'); return; }
  var frame       = document.createElement('iframe');
  frame.id        = 'pgm-frame-group-' + ovl.group;
  frame.className = 'ovl-frame pgm-frame';
  frame.setAttribute('allowtransparency', 'true');  // belt-and-suspenders for older Safari
  frame.style.visibility = 'visible';
  frame.style.zIndex     = _PGM_Z[ovl.group];       // explicit stacking: A=10, B=20, C=30
  frame.src       = ovl.src + Q;  // SSE mode — sse-client.js connects inside
  // Also insert in DOM order A→B→C so stacking is correct even without explicit z-index.
  var myOrder  = _PGM_GROUP_ORDER.indexOf(ovl.group);
  var insertBefore = null;
  for (var i = myOrder + 1; i < _PGM_GROUP_ORDER.length; i++) {
    var later = document.getElementById('pgm-frame-group-' + _PGM_GROUP_ORDER[i]);
    if (later) { insertBefore = later; break; }
  }
  insertBefore ? screen.insertBefore(frame, insertBefore) : screen.appendChild(frame);
  _pgmFrames[ovl.group] = ovl.key;
  DL('_createPGMGroupFrame — group=' + ovl.group + ' key=' + ovl.key + ' z=' + _PGM_Z[ovl.group] + ' total pgm-frames=' + document.querySelectorAll('.pgm-frame').length);
}

// ─── PVW OVERLAY SELECTOR ─────────────────────────────────────────────────────
// id is assigned at click time (not run time) so cancel poll in _createPVWFrame
// can detect when a newer transition has started and abort the current iframe load.
async function selectPVW(key, id) {
  _setLifecycleStage('[PVW#' + id + '] enter:' + key);
  DL('[PVW#' + id + '] selectPVW ENTER key=' + key + ' _pvwKey=' + _pvwKey +
     ' pvwSelection=' + pvwSelection + ' _taking=' + _taking + ' activeId=' + _activeTransitionId);
  try {
    pvwSelection = key;
    _ctrlKey     = null;

    var ovl = key ? OVL_BY_KEY[key] : null;
    if (key && !ovl) {
      console.error('[PVW#' + id + '] ABORT: missing ovl config for key=' + key);
      _setLifecycleStage('[PVW#' + id + '] abort:unknown-key');
      return;
    }

    if (key && ovl) {
      if (_pvwKey === key) {
        _setLifecycleStage('[PVW#' + id + '] same-overlay:push');
        DL('[PVW#' + id + '] same overlay — pushing state, no iframe swap');
        pushToPVW(ovl);
      } else {
        await _createPVWFrame(ovl, id);

        // Stale guard: if a newer selectPVW ran while we awaited _createPVWFrame, stop here.
        if (id !== _activeTransitionId) {
          DL('[PVW#' + id + '] ABORT: stale — active is now #' + _activeTransitionId);
          _setLifecycleStage('[PVW#' + id + '] abort:stale');
          return;
        }

        _setLifecycleStage('[PVW#' + id + '] iframe-ready:' + key);
        DL('[PVW#' + id + '] overlay-ready confirmed — two-phase handshake complete key=' + key);
      }
    } else {
      _setLifecycleStage('[PVW#' + id + '] destroy');
      _destroyPVWFrame();
    }

    var emptyEl = document.getElementById('pvw-empty');
    if (emptyEl) emptyEl.style.display = key ? 'none' : 'flex';

    var cur = document.getElementById('pvw-current');
    if (cur) {
      cur.textContent = ovl ? ovl.label : '—';
      cur.className   = 'monitor-current' + (key ? ' active' : '');
    }

    _setLifecycleStage('[PVW#' + id + '] COMPLETE:' + key);
    applyScale();
    renderOvlButtons();
    updateTakeBtn();
    updateCutBtn();
    renderCtrlPanel();
  } catch(err) {
    _setLifecycleStage('[PVW#' + id + '] EXCEPTION:' + err.message);
    console.error('[PVW#' + id + '] selectPVW EXCEPTION key=' + key, err.message, err);
  } finally {
    DL('[PVW#' + id + '] selectPVW FINALLY — activeId=' + _activeTransitionId +
       ' pvw-frames=' + document.querySelectorAll('.pvw-frame').length);
    _hudUpdate();
  }
}

// ─── TAKE BUTTON STATE ────────────────────────────────────────────────────────
function updateTakeBtn() {
  document.getElementById('take-btn').classList.toggle('ready', pvwSelection !== null);
}

function updateCutBtn() {
  var ovl = pvwSelection ? OVL_BY_KEY[pvwSelection] : null;
  var btn = document.getElementById('cut-btn');
  if (!btn) return;
  btn.textContent = ovl ? 'CUT ' + ovl.group : 'CUT';
  btn.disabled    = !ovl;
}

var _lastGroupStripKey = null;
function renderGroupStrip() {
  var strip = document.getElementById('group-strip');
  if (!strip) return;
  var groups = (liveState.program && liveState.program.groups) || {};
  var stripKey = _PGM_GROUP_ORDER.map(function(g) { return g + ':' + (groups[g] || ''); }).join('|');
  if (stripKey === _lastGroupStripKey) return;
  _lastGroupStripKey = stripKey;
  strip.innerHTML = '';
  _PGM_GROUP_ORDER.forEach(function(g) {
    var key  = groups[g] || null;
    var ovl  = key ? OVL_BY_KEY[key] : null;
    var pill = document.createElement('div');
    pill.className = 'grp-pill' + (key ? ' live' : '');
    var dot   = document.createElement('div');  dot.className = 'grp-pill-dot';
    var label = document.createElement('div');  label.className = 'grp-pill-label';  label.textContent = g;
    var name  = document.createElement('div');  name.className = 'grp-pill-name';    name.textContent = ovl ? ovl.label : 'Clear';
    pill.appendChild(dot); pill.appendChild(label); pill.appendChild(name);
    strip.appendChild(pill);
  });
}

// ─── TAKE — transition PVW selection to program ──────────────────────────────
// Calls /broadcast/take which atomically:
//   1. Clears other overlays in the same mutual-exclusion group
//   2. Sets the scene flag to true
//   3. Sets program.scene = scene
//   4. Fires SSE to all clients
// On 200, applies an optimistic local update so director UI updates immediately
// without waiting for the SSE round-trip (~50-200ms).
async function _doTake() {
  _setLifecycleStage('doTake:enter');
  DL('_doTake() ENTER — _taking=' + _taking + ' pvwSelection=' + pvwSelection + ' scene=' + ((liveState.program||{}).scene||'null'));
  if (_taking || !pvwSelection) {
    _setLifecycleStage('doTake:BLOCKED _taking=' + _taking + ' pvwSelection=' + pvwSelection);
    DL('_doTake() BLOCKED — _taking=' + _taking + ' pvwSelection=' + pvwSelection);
    return;
  }
  var ovl = OVL_BY_KEY[pvwSelection];
  if (!ovl) { DL('_doTake() BLOCKED — no ovl found for key=' + pvwSelection); return; }

  _taking = true;
  _takingAt = Date.now();
  var btn = null;
  var _takeTimer = setTimeout(function() {
    console.error('[_doTake] SAFETY TIMEOUT 8s — forcing reset');
    _taking = false;
    _takingAt = 0;
    if (btn) { btn.disabled = false; }
  }, 8000);

  try {
    btn = document.getElementById('take-btn');
    if (!btn) { console.error('[_doTake] take-btn NOT in DOM'); }
    else { btn.disabled = true; DL('_doTake() take-btn.disabled=true'); }

    DL('_doTake() POSTing /broadcast/take scene=' + ovl.key);
    var r = await fetch('/broadcast/take', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({scene: ovl.key}),
      credentials: 'include',
    });
    DL('_doTake() response status=' + r.status);

    if (r.status === 401 || r.status === 403) {
      document.getElementById('auth-notice').classList.add('visible');
      showStatus('Login required — see link below', false);
      DL('_doTake() auth failure — will reset in finally');
      return;
    }

    if (!r.ok) {
      var msg = 'Server error (' + r.status + ')';
      try { var j = await r.json(); if (j.error) msg = j.error; } catch(_) {}
      showStatus(msg, false);
      DL('_doTake() server error: ' + msg + ' — will reset in finally');
      return;
    }

    document.getElementById('auth-notice').classList.remove('visible');
    var result = await r.json();
    DL('_doTake() success — takenAt=' + result.takenAt);

    // Optimistic local update — clear same-group peers, set this overlay's flags.
    // Other groups are untouched so they remain live.
    OVERLAYS.forEach(function(o) {
      if (o.group === ovl.group && o.key !== ovl.key) {
        o.pgmKeys.forEach(function(f) { liveState[f] = false; });
      }
    });
    ovl.pvwFlags.forEach(function(f) { liveState[f] = true; });
    // Update program.groups — keeps local state consistent with server model
    var _prevProg   = liveState.program || {};
    var _newGroups  = Object.assign({}, _prevProg.groups || {});
    _newGroups[ovl.group] = ovl.key;
    liveState.program = { scene: ovl.key, groups: _newGroups, takenAt: result.takenAt, cleanAt: _prevProg.cleanAt };
    DL('_doTake() optimistic — group=' + ovl.group + ' key=' + ovl.key + ' groups=' + JSON.stringify(_newGroups));

    _createPGMGroupFrame(ovl);
    applyScale();

    try { renderPGMStatus(); }   catch(e) { console.error('[_doTake renderPGMStatus]', e); }
    try { renderPGMVisibility(); } catch(e) { console.error('[_doTake renderPGMVisibility]', e); }
    try { renderOvlButtons(); }  catch(e) { console.error('[_doTake renderOvlButtons]', e); }
    try { renderGroupStrip(); }  catch(e) {}
    try { updateCutBtn(); }      catch(e) {}
    showStatus('Taken live — ' + ovl.label, true);
    DL('_doTake() SUCCESS complete');

  } catch(e) {
    _setLifecycleStage('doTake:EXCEPTION');
    console.error('[_doTake() EXCEPTION]', e.message, e);
    showStatus('Network error', false);
  } finally {
    clearTimeout(_takeTimer);
    _taking = false;
    _takingAt = 0;
    if (btn) { btn.disabled = false; }
    _setLifecycleStage('doTake:finally-reset');
    DL('_doTake() FINALLY — _taking=false btn.disabled=false');
  }
}
function take() { DL('take() enqueued'); _enqueue(_doTake); }

// ─── CLEAN / CUT ─────────────────────────────────────────────────────────────
// Calls /broadcast/clean which clears all director overlay flags atomically.
async function _doClean() {
  // Determine which group to clean from the current PVW selection.
  var ovl = pvwSelection ? OVL_BY_KEY[pvwSelection] : null;
  if (!ovl) { DL('_doClean() BLOCKED — no pvwSelection'); return; }
  var group = ovl.group;
  DL('_doClean() ENTER — group=' + group + ' pvwSelection=' + pvwSelection);
  try {
    var r = await fetch('/broadcast/clean_group', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({group: group}),
      credentials: 'include',
    });
    DL('_doClean() response status=' + r.status);

    if (r.status === 401 || r.status === 403) {
      document.getElementById('auth-notice').classList.add('visible');
      showStatus('Login required', false);
      DL('_doClean() auth failure');
      return;
    }
    if (!r.ok) {
      showStatus('Error (' + r.status + ')', false);
      DL('_doClean() server error ' + r.status);
      return;
    }

    document.getElementById('auth-notice').classList.remove('visible');
    var result = await r.json();

    // Optimistic local update — clear only this group's flags; other groups untouched.
    OVERLAYS.forEach(function(o) {
      if (o.group === group) o.pgmKeys.forEach(function(f) { liveState[f] = false; });
    });
    // Update program.groups — remove this group; preserve others
    var _cProg   = liveState.program || {};
    var _cGroups = Object.assign({}, _cProg.groups || {});
    delete _cGroups[group];
    var _cScene  = _cProg.scene;
    var _cSceneOvl = _cScene ? OVL_BY_KEY[_cScene] : null;
    var _newScene  = (_cSceneOvl && _cSceneOvl.group === group) ? null : _cScene;
    liveState.program = { scene: _newScene, groups: _cGroups, takenAt: _cProg.takenAt, cleanAt: result.cleanAt };
    _destroyPGMGroup(group);
    DL('_doClean() optimistic — group=' + group + ' cleared. pgm-frames=' + document.querySelectorAll('.pgm-frame').length);

    try { renderPGMStatus(); }   catch(e) { console.error('[_doClean renderPGMStatus]', e); }
    try { renderPGMVisibility(); } catch(e) { console.error('[_doClean renderPGMVisibility]', e); }
    try { renderOvlButtons(); }  catch(e) { console.error('[_doClean renderOvlButtons]', e); }
    try { renderGroupStrip(); }  catch(e) {}
    try { updateCutBtn(); }      catch(e) {}

    var btnCount = document.querySelectorAll('.ovl-btn').length;
    DL('_doClean() post-render btnCount=' + btnCount + ' (expected ' + OVERLAYS.length + ')');

    showStatus('Group ' + group + ' clean — ' + ovl.label + ' off', true);
    DL('_doClean() SUCCESS complete');

  } catch(e) {
    console.error('[_doClean() EXCEPTION]', e.message, e);
    showStatus('Network error', false);
  }
  DL('_doClean() EXIT');
}
function goClean() { DL('goClean() enqueued'); _enqueue(_doClean); }

// ─── CLEAN ALL — clears every group atomically ────────────────────────────────
// CLN button: calls /broadcast/clean which resets all overlay flags and program.groups.
// Distinct from CUT (group-selective clean). Use CLN to fully black out all outputs.
async function _doCleanAll() {
  DL('_doCleanAll() ENTER');
  try {
    var r = await fetch('/broadcast/clean', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({}),
      credentials: 'include',
    });
    if (r.status === 401 || r.status === 403) {
      document.getElementById('auth-notice').classList.add('visible');
      showStatus('Login required', false);
      return;
    }
    if (!r.ok) {
      showStatus('Error (' + r.status + ')', false);
      return;
    }
    document.getElementById('auth-notice').classList.remove('visible');
    var result = await r.json();

    OVERLAYS.forEach(function(o) {
      o.pgmKeys.forEach(function(f) { liveState[f] = false; });
    });
    var _cProg = liveState.program || {};
    liveState.program = { scene: null, groups: {}, takenAt: _cProg.takenAt, cleanAt: result.cleanAt };
    _PGM_GROUP_ORDER.forEach(function(g) { _destroyPGMGroup(g); });

    try { renderPGMStatus(); }     catch(e) { console.error('[_doCleanAll renderPGMStatus]', e); }
    try { renderPGMVisibility(); } catch(e) {}
    try { renderOvlButtons(); }    catch(e) { console.error('[_doCleanAll renderOvlButtons]', e); }
    try { renderGroupStrip(); }    catch(e) {}
    try { updateCutBtn(); }        catch(e) {}
    showStatus('All groups clean', true);
    DL('_doCleanAll() SUCCESS');
  } catch(e) {
    console.error('[_doCleanAll() EXCEPTION]', e.message, e);
    showStatus('Network error', false);
  }
}
function goCleanAll() { DL('goCleanAll() enqueued'); _enqueue(_doCleanAll); }

// ─── STATUS BAR ───────────────────────────────────────────────────────────────
function showStatus(msg, ok) {
  var el   = document.getElementById('status-text');
  var time = document.getElementById('status-time');
  el.textContent = msg;
  el.className   = ok ? 'status-ok' : 'status-err';
  var n = new Date();
  time.textContent = String(n.getHours()).padStart(2,'0') + ':' +
                     String(n.getMinutes()).padStart(2,'0') + ':' +
                     String(n.getSeconds()).padStart(2,'0');
}

// ─── SCALE — fit 1920×1080 iframes into monitor bodies ───────────────────────

function applyScale() {
  var pvwBody = document.getElementById('pvw-body');
  if (!pvwBody) { DL('applyScale — ABORT: pvwBody not in DOM'); return; }

  var w     = pvwBody.offsetWidth;
  var scale = w / 1920;
  var frames = document.querySelectorAll('.ovl-frame');

  if (w === 0) {
    console.error('[SCALE] pvwBody.offsetWidth=0 — container is collapsed; transform will be scale(0)');
  }

  if (DEBUG) {
    var brc = pvwBody.getBoundingClientRect();
    DL('[SCALE] pvwBody.offsetW=' + w + ' offsetH=' + pvwBody.offsetHeight +
       ' bRect=' + Math.round(brc.width) + 'x' + Math.round(brc.height) +
       ' → scale=' + scale.toFixed(6) + ' frames=' + frames.length);
    var pvwScreen = document.getElementById('pvw-screen');
    if (pvwScreen) {
      var scrOvf = window.getComputedStyle(pvwScreen).overflow;
      DL('[SCALE] pvwScreen overflow=' + scrOvf);
    }
  }

  frames.forEach(function(el) {
    el.style.transform       = 'scale(' + scale + ')';
    el.style.transformOrigin = 'top left';
    if (_dbgOn) el.style.outline = '3px solid red';
    DL('[SCALE]   iframe ' + el.id + ' → scale(' + scale.toFixed(5) + ')');
  });

  _dbgUpdateHUD();
}

window.addEventListener('resize', function() {
  clearTimeout(window._scaleTimer);
  window._scaleTimer = setTimeout(applyScale, 40);
});

// ─── PVW SCALE DEBUG HUD ──────────────────────────────────────────────────────
var _dbgOn    = false;
var _dbgTimer = null;

function _dbgUpdateHUD() {
  var hud = document.getElementById('pvw-dbg-hud');
  if (!hud) return;

  var pvwBody   = document.getElementById('pvw-body');
  var pvwScreen = document.getElementById('pvw-screen');
  if (!pvwBody || !pvwScreen) { hud.textContent = '(pvwBody not found)'; return; }

  var brc    = pvwBody.getBoundingClientRect();
  var scrBrc = pvwScreen.getBoundingClientRect();
  var w      = pvwBody.offsetWidth;
  var h      = pvwBody.offsetHeight;
  var scale  = w / 1920;
  var pvwFrames = document.querySelectorAll('#pvw-screen iframe');

  var frameLines = [];
  pvwFrames.forEach(function(f) {
    var fr = f.getBoundingClientRect();
    frameLines.push(
      '  ' + f.id + '\n' +
      '    visibility : ' + (f.style.visibility || 'css-class') + '\n' +
      '    transform  : ' + (f.style.transform  || 'none') + '\n' +
      '    bRect      : ' + Math.round(fr.width) + ' × ' + Math.round(fr.height) +
                   ' @ (' + Math.round(fr.left) + ', ' + Math.round(fr.top) + ')\n' +
      '    contentWin : ' + (!!f.contentWindow)
    );
  });
  if (!frameLines.length) frameLines = ['  (none)'];

  hud.textContent = [
    '─── PVW SCALE DIAG (D to hide) ────',
    'pvwBody  offsetW×H : ' + w + ' × ' + h,
    'pvwBody  bRect     : ' + Math.round(brc.width) + ' × ' + Math.round(brc.height),
    'pvwScreen bRect    : ' + Math.round(scrBrc.width) + ' × ' + Math.round(scrBrc.height),
    'scale (W÷1920)     : ' + scale.toFixed(6),
    'scaled 1920×1080   : ' + Math.round(1920*scale) + ' × ' + Math.round(1080*scale),
    '_pvwKey            : ' + (_pvwKey || 'null'),
    'pvwSelection       : ' + (pvwSelection || 'null'),
    'pvw iframes        : ' + pvwFrames.length,
    '',
    'iframe details:',
  ].concat(frameLines).join('\n');
}

function _dbgToggle() {
  _dbgOn = !_dbgOn;
  var hud    = document.getElementById('pvw-dbg-hud');
  var runHud = document.getElementById('runtime-hud');
  if (hud)    { hud.classList.toggle('on', _dbgOn); }
  if (runHud) { runHud.classList.toggle('on', _dbgOn); }
  if (_dbgOn) _hudUpdate();
  DL('DEBUG HUD ' + (_dbgOn ? 'ON — press D again to hide' : 'OFF'));

  // Debug borders: yellow=pvwBody, orange=pvwScreen, red=iframe
  var pvwBody   = document.getElementById('pvw-body');
  var pvwScreen = document.getElementById('pvw-screen');
  if (pvwBody)   pvwBody.style.outline   = _dbgOn ? '3px solid yellow' : '';
  if (pvwScreen) pvwScreen.style.outline = _dbgOn ? '3px solid orange' : '';
  if (!_dbgOn) {
    // Remove debug borders from iframes and bodies when HUD is hidden
    document.querySelectorAll('.ovl-frame').forEach(function(f) { f.style.outline = ''; });
    document.querySelectorAll('.ovl-frame').forEach(function(f) {
      try {
        var b = f.contentDocument && f.contentDocument.body;
        if (b) b.style.outline = '';
      } catch(e) {}
    });
  }

  if (_dbgOn) {
    applyScale();  // re-apply so debug borders get drawn on iframes/bodies
    _dbgUpdateHUD();
    if (!_dbgTimer) _dbgTimer = setInterval(_dbgUpdateHUD, 300);
  } else {
    if (_dbgTimer) { clearInterval(_dbgTimer); _dbgTimer = null; }
  }
}

// ─── INLINE OVERLAY CONTROLS ──────────────────────────────────────────────────
function getCats() {
  var cats = liveState.categories || [];
  return cats.map(function(c) { return (typeof c === 'string') ? c : (c.name || ''); }).filter(Boolean);
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

var _ctrlKey = null;
function renderCtrlPanel() {
  var panel = document.getElementById('ctrl-panel');
  if (!panel) return;
  // Short-circuit: overlays without controls never show a ctrl panel.
  var selOvl = pvwSelection ? OVL_BY_KEY[pvwSelection] : null;
  if (selOvl && !selOvl.hasControls) {
    if (panel.classList.contains('open')) { panel.innerHTML = ''; panel.classList.remove('open'); _ctrlKey = null; }
    return;
  }
  // Dirty-check: skip DOM rebuild if nothing relevant changed.
  // Prevents innerHTML thrash (and focused-<select> destruction) on every SSE tick.
  // Key built from per-overlay ctrlStateKeys — only the fields that overlay's ctrl panel reads.
  var stateKeys = (selOvl && selOvl.ctrlStateKeys) || [];
  var key = pvwSelection + '|' + stateKeys.map(function(k) {
    if (k === 'categories') return getCats().join(',');
    var v = liveState[k];
    if (v == null) return '';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }).join('|');
  if (key === _ctrlKey) return;
  _ctrlKey = key;
  var html = selOvl && selOvl.ctrlBuilder ? selOvl.ctrlBuilder() : '';
  panel.innerHTML = html;
  panel.classList.toggle('open', !!html);
}

function buildLbCtrls() {
  var cats  = getCats();
  var cur   = liveState.lbCategory || (cats[0] || '');
  var count = liveState.lbDisplayCount || 8;
  var frozen = !!liveState.lbFrozen;

  var catOpts = cats.length
    ? cats.map(function(c) {
        return '<option value="' + esc(c) + '"' + (c === cur ? ' selected' : '') + '>' + esc(c) + '</option>';
      }).join('')
    : '<option>—</option>';

  var countBtns = [5,8,10,15].map(function(n) {
    return '<button class="ctrl-btn' + (count === n ? ' active' : '') + '" onclick="ctrlLbCount(' + n + ')">' + n + '</button>';
  }).join('');

  return '<span class="ctrl-label">Category</span>' +
    '<select class="ctrl-select" onchange="ctrlLbCat(this.value)">' + catOpts + '</select>' +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Rows</span>' + countBtns +
    '<span class="ctrl-sep"></span>' +
    '<button class="ctrl-btn' + (frozen ? ' active' : '') + '" onclick="ctrlLbFreeze()">' +
      (frozen ? '⏸ Frozen' : 'Freeze') +
    '</button>';
}

function buildLineupCtrls() {
  var cats = getCats();
  var idx  = typeof liveState.lineupIndex === 'number' ? liveState.lineupIndex : 0;
  var dur  = liveState.lineupDuration || 5;
  var auto = liveState.lineupAuto !== false;

  var catBtns = cats.map(function(c, i) {
    return '<button class="ctrl-btn' + (i === idx ? ' active' : '') + '" onclick="ctrlLineupIdx(' + i + ')">' + esc(c) + '</button>';
  }).join('');
  if (!catBtns) catBtns = '<span class="ctrl-label" style="opacity:0.5">No categories</span>';

  var durOpts = [3,5,8,10,15].map(function(n) {
    return '<option value="' + n + '"' + (dur === n ? ' selected' : '') + '>' + n + 's</option>';
  }).join('');

  return '<span class="ctrl-label">Category</span>' + catBtns +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Duration</span>' +
    '<select class="ctrl-select" onchange="ctrlLineupDur(this.value)">' + durOpts + '</select>' +
    '<button class="ctrl-btn' + (auto ? ' active' : '') + '" onclick="ctrlLineupAuto()">' + (auto ? 'Auto' : 'Manual') + '</button>';
}

function buildH2HCtrls() {
  var left  = (liveState.h2hLeft  || {}).name || '';
  var right = (liveState.h2hRight || {}).name || '';
  return '<span class="ctrl-label">Left</span>' +
    '<input class="ctrl-input" type="text" placeholder="Athlete name" value="' + esc(left)  + '" onchange="ctrlH2H(\'left\',this.value)">' +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Right</span>' +
    '<input class="ctrl-input" type="text" placeholder="Athlete name" value="' + esc(right) + '" onchange="ctrlH2H(\'right\',this.value)">';
}

function buildManualLtCtrls() {
  var line1 = liveState.manualLine1 || '';
  var line2 = liveState.manualLine2 || '';
  var score = liveState.manualScore || '';
  return '<span class="ctrl-label">Line 1</span>' +
    '<input class="ctrl-input" type="text" placeholder="Name / title" value="' + esc(line1) + '" onchange="postUpdate({manualLine1:this.value})">' +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Line 2</span>' +
    '<input class="ctrl-input" type="text" placeholder="Subtitle" value="' + esc(line2) + '" onchange="postUpdate({manualLine2:this.value})">' +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Score</span>' +
    '<input class="ctrl-input" type="text" placeholder="Score / detail" value="' + esc(score) + '" onchange="postUpdate({manualScore:this.value})">';
}

function buildChampCtrls() {
  var name   = liveState.champName   || '';
  var detail = liveState.champDetail || '';
  var score  = liveState.champScore  || '';
  var events = liveState.champEvents || '';
  return '<span class="ctrl-label">Name</span>' +
    '<input class="ctrl-input" type="text" placeholder="Athlete name" value="' + esc(name)   + '" onchange="postUpdate({champName:this.value})">' +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Detail</span>' +
    '<input class="ctrl-input" type="text" placeholder="Country / division" value="' + esc(detail) + '" onchange="postUpdate({champDetail:this.value})">' +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Score</span>' +
    '<input class="ctrl-input" type="text" placeholder="Score" value="' + esc(score)  + '" onchange="postUpdate({champScore:this.value})">' +
    '<span class="ctrl-sep"></span>' +
    '<span class="ctrl-label">Events</span>' +
    '<input class="ctrl-input" type="text" placeholder="e.g. 6/6" value="' + esc(events) + '" onchange="postUpdate({champEvents:this.value})">';
}

// ─── CONTROL ACTION HELPERS ───────────────────────────────────────────────────
async function postUpdate(obj) {
  try {
    var r = await fetch('/update', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(obj), credentials:'include'
    });
    if (r.ok) {
      Object.assign(liveState, obj);
      _pushCurrentPVW();  // reflect change in PVW immediately, before SSE round-trip
      renderCtrlPanel(); renderOvlButtons();
    } else if (r.status === 401 || r.status === 403) {
      document.getElementById('auth-notice').classList.add('visible');
      showStatus('Login required', false);
    } else {
      showStatus('Error ' + r.status, false);
    }
  } catch(e) { showStatus('Network error', false); }
}

async function ctrlLbCat(cat) {
  // Optimistic update — reflect selection immediately so the operator sees instant response.
  // The server confirms and delivers the actual lbAthletes payload via SSE shortly after.
  liveState.lbCategory = cat;
  _pushCurrentPVW();
  renderCtrlPanel();
  try {
    var r = await fetch('/director/lb', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({category: cat, override: true}), credentials:'include'
    });
    if (!r.ok) { showStatus('Error ' + r.status, false); }
  } catch(e) { showStatus('Network error', false); }
}
function ctrlLbCount(n)   { postUpdate({lbDisplayCount: n}); }
function ctrlLbFreeze()   { postUpdate({lbFrozen: !liveState.lbFrozen}); }
function ctrlLineupIdx(i) { postUpdate({lineupIndex: i}); }
function ctrlLineupDur(n) { postUpdate({lineupDuration: parseInt(n,10)}); }
function ctrlLineupAuto() { postUpdate({lineupAuto: liveState.lineupAuto === false ? true : false}); }
function ctrlH2H(side, val) {
  var key = side === 'left' ? 'h2hLeft' : 'h2hRight';
  var obj = Object.assign({}, liveState[key] || {});
  obj.name = val;
  var payload = {}; payload[key] = obj;
  postUpdate(payload);
}

// ─── KEYBOARD SHORTCUTS ───────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  var tag = (e.target || {}).tagName || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); take(); }
  if (e.key === 'Escape') { e.preventDefault(); goClean(); }
  if (e.key === 'd' || e.key === 'D') { _dbgToggle(); }
});

// ─── INIT ────────────────────────────────────────────────────────────────────
// Build selector buttons. No iframes created at init — all lazy.
// Initial SSE connection count: 1 (director's own).
(function init() {
  DL('init() — building overlay selector buttons');
  var selectorEl = document.getElementById('ovl-selector');
  OVERLAYS.forEach(function(ovl) {
    var btn = document.createElement('button');
    btn.className        = 'ovl-btn';
    btn.dataset.key      = ovl.key;
    btn.dataset.group    = ovl.group;
    btn.textContent      = ovl.label;
    btn.addEventListener('click', (function(key) {
      return function() {
        // Increment at click time — any in-flight _createPVWFrame cancel poll detects this immediately.
        var id = ++_activeTransitionId;
        DL('[PVW#' + id + '] ovl-btn CLICK key=' + key);
        _enqueue(function selectPVW_queued() { return selectPVW(key, id); });
      };
    }(ovl.key)));
    _ovlBtns[ovl.key] = btn;
    selectorEl.appendChild(btn);
    DL('init() — listener attached for key=' + ovl.key);
  });
  // Create debug HUD inside pvw-body
  (function() {
    var pvwBody = document.getElementById('pvw-body');
    if (pvwBody) {
      var hud = document.createElement('div');
      hud.id = 'pvw-dbg-hud';
      pvwBody.appendChild(hud);
      DL('init() — debug HUD created (press D to show)');
    }
  }());

  // ResizeObserver — fires whenever pvwBody dimensions change (flex reflow,
  // font load, ctrl-panel open/close, viewport change). More reliable than
  // window resize event alone for detecting when the monitor box changes size.
  if (window.ResizeObserver) {
    var _pvwBodyEl = document.getElementById('pvw-body');
    if (_pvwBodyEl) {
      var _pvwRO = new ResizeObserver(function(entries) {
        var e0 = entries[0];
        var w  = e0 && e0.contentRect ? e0.contentRect.width : '?';
        var h  = e0 && e0.contentRect ? e0.contentRect.height : '?';
        DL('[ResizeObserver] pvwBody=' + w + 'x' + h + ' — calling applyScale()');
        applyScale();
      });
      _pvwRO.observe(_pvwBodyEl);
      DL('init() — ResizeObserver attached to pvwBody');
    }
  } else {
    DL('init() — ResizeObserver NOT supported; scale only updates on window resize');
  }

  // Measure pvwBody now so any layout issues are visible immediately in logs
  (function() {
    var pvwBody = document.getElementById('pvw-body');
    if (pvwBody) {
      DL('[INIT MEASURE] pvwBody.offsetWidth=' + pvwBody.offsetWidth +
         ' offsetHeight=' + pvwBody.offsetHeight +
         ' bRect=' + JSON.stringify(pvwBody.getBoundingClientRect()));
    }
  }());

  setTimeout(applyScale, 80);
  renderGroupStrip();
  updateCutBtn();
  DL('init() — calling fetchState() and connect()');
  fetchState();
  connect();
  _setLifecycleStage('init-complete');
  DL('init() — complete. total ovl-btn in DOM: ' + document.querySelectorAll('.ovl-btn').length);

  // ─── WATCHDOG ──────────────────────────────────────────────────────────────
  setInterval(function() {
    var btnCount = document.querySelectorAll('.ovl-btn').length;
    var pgmCount = document.querySelectorAll('.pgm-frame').length;
    _hudUpdate();
    if (DEBUG) {
      console.log('[WATCHDOG]', {
        build:           BUILD_ID,
        stage:           _lifecycleStage,
        taking:          _taking,
        pvw:             pvwSelection,
        scene:           (liveState.program || {}).scene || null,
        buttons:         btnCount,
        takeBtnDisabled: (document.getElementById('take-btn') || {}).disabled,
        pvwFrames:       document.querySelectorAll('.pvw-frame').length,
        pgmFrames:       pgmCount,
        pgmGroups:       JSON.stringify(_pgmFrames),
        sseState:        _es ? _es.readyState : 'null',
      });
    }
    if (_taking && _takingAt && (Date.now() - _takingAt > 4000)) { console.warn('[WATCHDOG] _taking stuck >4s — possible deadlock. stage=' + _lifecycleStage); }
    if (btnCount !== OVERLAYS.length) { console.error('[WATCHDOG] button count wrong — expected=' + OVERLAYS.length + ' got=' + btnCount); }
    if (pgmCount > 3)         { console.error('[WATCHDOG] PGM iframe leak — ' + pgmCount + ' frames in DOM'); }
    if (/src-set:|iframe-load:/.test(_lifecycleStage)) {
      console.warn('[WATCHDOG] handshake stall — stage=' + _lifecycleStage);
    }
  }, 2000);
}());
</script>
