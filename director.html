<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Broadcast Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --red:#CC0000; --green:#00AA44; --green-bright:#00DD55;
  --gold:#D4A017; --gold-light:#F5C842;
  --bg:#0C0C0C; --surface:#161616; --surface2:#1E1E1E; --surface3:#252525;
  --border:rgba(255,255,255,0.08); --text:#F0F0F0; --dim:#777;
}
html,body { background:var(--bg); color:var(--text); font-family:'Barlow Condensed',sans-serif; min-height:100vh; overscroll-behavior:none; }

/* ── HEADER ─────────────────────────────────────────────── */
.header {
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:12px 20px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
}
.header-left { display:flex; align-items:center; gap:14px; }
.back-link {
  background:var(--surface2); border:1px solid var(--border); border-radius:5px;
  padding:6px 12px; font-size:11px; font-weight:800; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--dim); text-decoration:none; white-space:nowrap;
  transition:color 0.15s,border-color 0.15s;
}
.back-link:hover { color:var(--text); border-color:rgba(255,255,255,0.2); }
.header-logo { height:40px; width:auto; object-fit:contain; mix-blend-mode:lighten; }
.header-title { font-size:18px; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; color:#fff; line-height:1; }
.header-sub   { font-size:10px; font-weight:600; letter-spacing:0.22em; color:var(--dim); text-transform:uppercase; margin-top:1px; }
.header-right { display:flex; align-items:center; gap:6px; }
.conn-dot  { width:8px; height:8px; border-radius:50%; background:#333; display:inline-block; }
.conn-dot.ok { background:var(--green-bright); animation:pulse 2s infinite; }
.conn-text { font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--dim); text-transform:uppercase; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── MAIN ───────────────────────────────────────────────── */
.main { padding:14px; max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }

/* ── COMPETITION STRIP ──────────────────────────────────── */
.comp-strip {
  background:var(--surface); border:1px solid var(--border); border-radius:6px;
  padding:10px 16px; display:flex; align-items:center; gap:0; flex-wrap:wrap;
  overflow:hidden;
}
.ctx-item {
  font-size:12px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
  color:rgba(255,255,255,0.45); font-family:'Barlow',sans-serif; white-space:nowrap;
  padding:2px 10px;
}
.ctx-item:first-child { padding-left:0; }
.ctx-item.ctx-comp { color:var(--text); }
.ctx-sep { color:rgba(255,255,255,0.15); font-size:14px; flex-shrink:0; }

/* ── DIRECTOR SECTION ───────────────────────────────────── */
.dir-section {
  background:var(--surface); border:1px solid var(--border); border-radius:7px;
  overflow:hidden;
}
.pgm-section { border-left:4px solid var(--green); }
.pvw-section { border-left:4px solid var(--gold); }

.dir-section-head {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  background:var(--surface2); border-bottom:1px solid var(--border);
}
.dir-indicator {
  width:7px; height:7px; border-radius:50%; flex-shrink:0;
}
.pgm-indicator { background:var(--green-bright); animation:pulse 2s infinite; }
.pvw-indicator { background:var(--gold); }
.dir-label {
  font-size:11px; font-weight:800; letter-spacing:0.22em; text-transform:uppercase; color:var(--dim);
}
.dir-badge {
  font-size:9px; font-weight:900; letter-spacing:0.18em; text-transform:uppercase;
  padding:2px 8px; border-radius:3px;
  background:rgba(0,170,68,0.12); color:var(--green-bright);
  border:1px solid rgba(0,170,68,0.25);
}
.dir-hint {
  margin-left:auto;
  font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase;
  color:rgba(255,255,255,0.18); font-family:'Barlow',sans-serif;
}

/* ── OVERLAY TILES ──────────────────────────────────────── */
.tile-row {
  display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:10px;
}
.pgm-tile, .pvw-tile {
  border-radius:4px; border:1px solid;
  font-size:12px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase;
  text-align:center; display:flex; align-items:center; justify-content:center;
  min-height:62px; padding:10px 8px;
  position:relative; transition:all 0.14s;
  line-height:1.2;
}

/* PGM — read-only state display */
.pgm-tile.on  { background:rgba(0,170,68,0.1);  border-color:var(--green);  color:var(--green-bright); }
.pgm-tile.off { background:var(--surface3);      border-color:var(--border); color:rgba(255,255,255,0.18); }

/* PVW — interactive, stageable */
.pvw-tile { cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
.pvw-tile:active { transform:scale(0.96); }
.pvw-tile.on  { background:rgba(212,160,23,0.1);  border-color:var(--gold);   color:var(--gold-light); }
.pvw-tile.off { background:var(--surface3);        border-color:var(--border); color:rgba(255,255,255,0.32); }
.pvw-tile:hover.off { border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.6); }
.pvw-tile:hover.on  { border-color:var(--gold-light); }

/* Diff dots — signals which tiles will change on TAKE */
.pvw-tile.diff::after {
  content:''; position:absolute; top:6px; right:6px;
  width:5px; height:5px; border-radius:50%;
}
.pvw-tile.on.diff::after  { background:rgba(245,200,66,0.65); }
.pvw-tile.off.diff::after { background:rgba(220,80,80,0.55); }

/* ── SCENES ─────────────────────────────────────────────── */
.scene-section .dir-section-head { border-bottom:none; }
.scene-row {
  display:flex; gap:8px; padding:10px; flex-wrap:wrap;
}
.scene-btn {
  flex:1; min-width:120px;
  padding:13px 12px;
  border-radius:4px; border:1px solid var(--border);
  background:var(--surface3); color:rgba(255,255,255,0.4);
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase;
  cursor:pointer; transition:all 0.14s; -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
.scene-btn:hover  { border-color:rgba(255,255,255,0.2); color:var(--text); }
.scene-btn:active { transform:scale(0.97); }
.scene-btn.active {
  background:rgba(212,160,23,0.08); border-color:var(--gold); color:var(--gold-light);
}

/* ── ACTION ─────────────────────────────────────────────── */
.action-area {
  display:flex; gap:8px; align-items:stretch;
}
#take-btn {
  flex:3; padding:20px;
  border-radius:5px; border:2px solid var(--border);
  background:var(--surface2); color:rgba(255,255,255,0.2);
  font-family:'Barlow Condensed',sans-serif;
  font-size:26px; font-weight:900; letter-spacing:0.24em; text-transform:uppercase;
  cursor:pointer; transition:all 0.18s;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
#take-btn.live {
  background:rgba(0,100,40,0.3); border-color:var(--green); color:var(--green-bright);
}
#take-btn.live:hover { background:rgba(0,120,50,0.38); }
#take-btn:active  { transform:scale(0.98); }
#take-btn:disabled { opacity:0.4; cursor:not-allowed; }

#cut-btn {
  flex:1; padding:20px 14px;
  border-radius:5px; border:1px solid var(--border);
  background:var(--surface2); color:rgba(255,255,255,0.3);
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px; font-weight:800; letter-spacing:0.2em; text-transform:uppercase;
  cursor:pointer; transition:all 0.14s;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
#cut-btn:hover  { border-color:rgba(255,255,255,0.2); color:rgba(255,255,255,0.55); }
#cut-btn:active { transform:scale(0.97); }

/* ── STATUS / AUTH ──────────────────────────────────────── */
.status-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px;
  background:var(--surface); border:1px solid var(--border); border-radius:6px;
  font-size:12px; font-weight:600; letter-spacing:0.08em;
  color:var(--dim); font-family:'Barlow',sans-serif;
}
.status-ok  { color:var(--green-bright); }
.status-err { color:#FF5555; }
.status-time { font-size:10px; opacity:0.55; font-variant-numeric:tabular-nums; }

.auth-notice {
  display:none;
  align-items:center; gap:10px;
  padding:10px 14px;
  background:rgba(204,0,0,0.06); border:1px solid rgba(204,0,0,0.2); border-radius:6px;
  font-size:12px; font-weight:600; letter-spacing:0.08em;
  color:rgba(255,100,100,0.85); font-family:'Barlow',sans-serif;
}
.auth-notice a {
  color:rgba(255,150,150,0.9); text-decoration:underline; font-weight:700;
}
.auth-notice.visible { display:flex; }

/* ── RESPONSIVE ─────────────────────────────────────────── */
@media(max-width:700px) {
  .tile-row { grid-template-columns:repeat(2,1fr); }
  .scene-row { gap:6px; }
  .scene-btn { font-size:12px; min-width:90px; }
  #take-btn { font-size:20px; }
}
@media(max-width:420px) {
  .tile-row { grid-template-columns:repeat(2,1fr); }
  .action-area { flex-direction:column; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <a class="back-link" href="/control.html">← Control</a>
    <img class="header-logo" src="/logo.png" alt="">
    <div>
      <div class="header-title">Broadcast Director</div>
      <div class="header-sub">Preview / Program</div>
    </div>
  </div>
  <div class="header-right">
    <span class="conn-dot" id="conn-dot"></span>
    <span class="conn-text" id="conn-text">Connecting</span>
  </div>
</div>

<div class="main">

  <!-- Competition context strip -->
  <div class="comp-strip">
    <span class="ctx-item ctx-comp" id="ctx-comp">—</span>
    <span class="ctx-sep">·</span>
    <span class="ctx-item" id="ctx-event">—</span>
    <span class="ctx-sep">·</span>
    <span class="ctx-item">Heat <span id="ctx-heat">—</span></span>
    <span class="ctx-sep">·</span>
    <span class="ctx-item" id="ctx-cat">—</span>
  </div>

  <!-- PROGRAM — what is live now -->
  <div class="dir-section pgm-section">
    <div class="dir-section-head">
      <span class="dir-indicator pgm-indicator"></span>
      <span class="dir-label">Program</span>
      <span class="dir-badge">Live</span>
    </div>
    <div class="tile-row" id="pgm-tiles"></div>
  </div>

  <!-- PREVIEW — what the director is staging -->
  <div class="dir-section pvw-section">
    <div class="dir-section-head">
      <span class="dir-indicator pvw-indicator"></span>
      <span class="dir-label">Preview</span>
      <span class="dir-hint">Tap tiles to stage · Take to go live</span>
    </div>
    <div class="tile-row" id="pvw-tiles"></div>
  </div>

  <!-- SCENES — preset overlay combinations -->
  <div class="dir-section scene-section">
    <div class="dir-section-head">
      <span class="dir-label">Scenes</span>
    </div>
    <div class="scene-row">
      <button class="scene-btn" data-scene="clean"       onclick="loadScene('clean')">Clean</button>
      <button class="scene-btn" data-scene="leaderboard" onclick="loadScene('leaderboard')">Leaderboard</button>
      <button class="scene-btn" data-scene="h2h"         onclick="loadScene('h2h')">Head to Head</button>
      <button class="scene-btn" data-scene="lineup"      onclick="loadScene('lineup')">Lineup</button>
    </div>
  </div>

  <!-- ACTION — take / cut -->
  <div class="action-area">
    <button id="take-btn" onclick="take()">TAKE</button>
    <button id="cut-btn"  onclick="take()">CUT</button>
  </div>

  <!-- Auth notice — shown when TAKE returns 401 -->
  <div class="auth-notice" id="auth-notice">
    <span>Operator login required to take live —</span>
    <a href="/comp/login" target="_blank">Log in at /comp/login</a>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span id="status-text">Ready — connect to /stream to start</span>
    <span id="status-time" class="status-time"></span>
  </div>

</div><!-- /main -->

<script>
// ─── OVERLAY DEFINITIONS ───────────────────────────────────────────────────────
// Order determines tile display order (left→right, top→bottom in 4-column grid)
const OVERLAYS = [
  { key:'leaderboard',       label:'Leaderboard'  },
  { key:'h2h',               label:'Head to Head' },
  { key:'lineup',            label:'Lineup'       },
  { key:'lowerThirdVisible', label:'Lower Third'  },
  { key:'repsVisible',       label:'Reps Counter' },
  { key:'lightsVisible',     label:'Lights'       },
  { key:'champion',          label:'Champion'     },
  { key:'eventBarVisible',   label:'Event Bar'    },
];

// Scene presets — keyed by overlay flag; unspecified flags are set false
const SCENES = {
  clean: {
    leaderboard:false, h2h:false, lineup:false, lowerThirdVisible:false,
    repsVisible:false,  lightsVisible:false, champion:false, eventBarVisible:false,
  },
  leaderboard: {
    leaderboard:true, h2h:false, lineup:false, lowerThirdVisible:false,
    repsVisible:false,  lightsVisible:false, champion:false, eventBarVisible:true,
  },
  h2h: {
    leaderboard:false, h2h:true, lineup:false, lowerThirdVisible:false,
    repsVisible:false,  lightsVisible:false, champion:false, eventBarVisible:false,
  },
  lineup: {
    leaderboard:false, h2h:false, lineup:true, lowerThirdVisible:false,
    repsVisible:false,  lightsVisible:false, champion:false, eventBarVisible:false,
  },
};

// ─── STATE ─────────────────────────────────────────────────────────────────────
var liveState      = {};
var pvwState       = {};
var pvwInitialized = false;

// ─── SSE CONNECTION ────────────────────────────────────────────────────────────
var _es = null, _retryTimer = null, _retryMs = 1000;

function setConn(ok) {
  document.getElementById('conn-dot').className  = 'conn-dot' + (ok ? ' ok' : '');
  document.getElementById('conn-text').textContent = ok ? 'Connected' : 'Disconnected';
  document.getElementById('conn-text').style.color = ok ? 'var(--green-bright)' : '#FF5555';
}

function connect() {
  if (_es) { _es.close(); _es = null; }
  _es = new EventSource('/stream');
  _es.onopen = function()    { _retryMs = 1000; setConn(true); };
  _es.onmessage = function(e){ try { onStateUpdate(JSON.parse(e.data)); } catch(_){} };
  _es.onerror = function()   {
    setConn(false); _es.close(); _es = null;
    _retryTimer = setTimeout(connect, _retryMs);
    _retryMs    = Math.min(_retryMs * 2, 30000);
  };
}

function disconnect() {
  if (_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; }
  if (_es)         { _es.close(); _es = null; }
}

function fetchState() {
  fetch('/state.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if (d) onStateUpdate(d); })
    .catch(function(){});
}

// Release SSE thread on tab hide; reconnect and sync on return
window.addEventListener('pagehide',   disconnect);
window.addEventListener('pageshow',   function(e){ if (e.persisted) { connect(); fetchState(); } });
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) { if (!_es) connect(); fetchState(); }
});

// ─── STATE UPDATE ──────────────────────────────────────────────────────────────
function onStateUpdate(d) {
  Object.assign(liveState, d);
  renderPGM();
  renderCtxStrip();
  // Initialise PVW from live state on first data received — no accidental changes on load
  if (!pvwInitialized) {
    OVERLAYS.forEach(function(o){ pvwState[o.key] = !!liveState[o.key]; });
    pvwInitialized = true;
    renderPVW();
  }
}

// ─── RENDER ────────────────────────────────────────────────────────────────────
function renderPGM() {
  OVERLAYS.forEach(function(o) {
    var el = document.getElementById('pgm-' + o.key);
    if (el) el.className = 'pgm-tile ' + (!!liveState[o.key] ? 'on' : 'off');
  });
}

function renderPVW() {
  OVERLAYS.forEach(function(o) {
    var el   = document.getElementById('pvw-' + o.key);
    if (!el) return;
    var isOn = !!pvwState[o.key];
    var diff = isOn !== !!liveState[o.key];
    el.className = 'pvw-tile ' + (isOn ? 'on' : 'off') + (diff ? ' diff' : '');
  });
  updateTakeBtn();
}

function renderCtxStrip() {
  var set = function(id, val) {
    var el = document.getElementById(id);
    if (el) el.textContent = val || '—';
  };
  set('ctx-comp',  liveState.compName     || liveState.compEventName || '—');
  set('ctx-event', liveState.compEventName || liveState.eventName    || '—');
  set('ctx-heat',  liveState.compHeat                                || '—');
  set('ctx-cat',   liveState.compCategory  || liveState.category     || '—');
}

function updateTakeBtn() {
  var hasDiff = OVERLAYS.some(function(o){ return !!pvwState[o.key] !== !!liveState[o.key]; });
  document.getElementById('take-btn').classList.toggle('live', hasDiff);
}

// ─── ACTIONS ───────────────────────────────────────────────────────────────────
function pvwToggle(key) {
  pvwState[key] = !pvwState[key];
  // Deactivate scene buttons — PVW no longer matches any preset
  document.querySelectorAll('.scene-btn').forEach(function(b){ b.classList.remove('active'); });
  renderPVW();
}

function loadScene(name) {
  var scene = SCENES[name];
  if (!scene) return;
  OVERLAYS.forEach(function(o){ pvwState[o.key] = !!scene[o.key]; });
  document.querySelectorAll('.scene-btn').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.querySelector('.scene-btn[data-scene="' + name + '"]');
  if (btn) btn.classList.add('active');
  renderPVW();
}

async function take() {
  var btn = document.getElementById('take-btn');
  btn.disabled = true;

  var payload = {};
  OVERLAYS.forEach(function(o){ payload[o.key] = !!pvwState[o.key]; });

  try {
    var r = await fetch('/update', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),
      credentials:'include',
    });

    if (r.status === 401 || r.status === 403 || (r.redirected && r.url.indexOf('login') !== -1)) {
      document.getElementById('auth-notice').classList.add('visible');
      showStatus('Login required — see link below', false);
    } else if (r.ok) {
      document.getElementById('auth-notice').classList.remove('visible');
      // Optimistically update live state — SSE will confirm within ~100ms
      Object.assign(liveState, payload);
      Object.assign(pvwState,  payload);
      renderPGM();
      renderPVW();
      showStatus('Taken live', true);
    } else {
      showStatus('Server error (' + r.status + ')', false);
    }
  } catch(e) {
    showStatus('Network error — is the server running?', false);
  } finally {
    btn.disabled = false;
  }
}

function showStatus(msg, ok) {
  var el   = document.getElementById('status-text');
  var time = document.getElementById('status-time');
  el.textContent = msg;
  el.className   = ok ? 'status-ok' : 'status-err';
  var now  = new Date();
  time.textContent =
    String(now.getHours()).padStart(2,'0')   + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0');
}

// ─── INIT — build tile DOM once ─────────────────────────────────────────────
(function buildTiles() {
  // PGM tiles — read-only
  document.getElementById('pgm-tiles').innerHTML = OVERLAYS.map(function(o) {
    return '<div class="pgm-tile off" id="pgm-' + o.key + '">' + o.label + '</div>';
  }).join('');

  // PVW tiles — clickable
  document.getElementById('pvw-tiles').innerHTML = OVERLAYS.map(function(o) {
    return '<div class="pvw-tile off" id="pvw-' + o.key + '" onclick="pvwToggle(\'' + o.key + '\')">' + o.label + '</div>';
  }).join('');
}());

// ─── START ────────────────────────────────────────────────────────────────────
fetchState();
connect();
</script>
</body>
</html>
