<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reps & Lights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; font-family:'Barlow Condensed',sans-serif; width:1920px; height:1080px; overflow:hidden; }
  :root {
    --bg:     rgba(6,6,6,0.95);
    --border: rgba(255,255,255,0.07);
    --gold:   #F5C842;
    --text:   #F0F0F0;
    --dim:    #666;
    --green:  #00EE55;
    --red:    #FF3322;
  }

  /* ── LIGHTS STRIP (top of screen, full width) ── */
  #lights-strip {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:stretch;
    transform:translateY(-100%); opacity:0;
    transition:transform 0.5s cubic-bezier(0.16,1,0.3,1), opacity 0.4s ease;
  }
  #lights-strip.visible { transform:translateY(0); opacity:1; }

  .light-panel {
    flex:1; height:70px; display:flex; align-items:center; justify-content:center; gap:14px;
    background:rgba(8,8,8,0.96); border-bottom:1px solid var(--border);
    border-right:1px solid var(--border); position:relative; overflow:hidden;
    transition:background 0.3s ease;
  }
  .light-panel:last-child { border-right:none; }
  .light-panel.good { background:rgba(0,160,50,0.25); border-bottom-color:rgba(0,220,70,0.5); }
  .light-panel.no   { background:rgba(180,20,0,0.25); border-bottom-color:rgba(255,40,20,0.5); }

  .lp-lane { font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--dim); }
  .lp-name { font-size:18px; font-weight:900; text-transform:uppercase; color:var(--text); letter-spacing:0.03em; }
  .lp-dot  { width:16px; height:16px; border-radius:50%; background:#222; flex-shrink:0; transition:background 0.25s, box-shadow 0.25s; }
  .lp-dot.good { background:var(--green); box-shadow:0 0 14px var(--green), 0 0 30px rgba(0,220,70,0.4); }
  .lp-dot.no   { background:var(--red);   box-shadow:0 0 14px var(--red),   0 0 30px rgba(255,40,20,0.4); }
  .lp-decision { font-size:13px; font-weight:800; letter-spacing:0.15em; text-transform:uppercase; color:transparent; transition:color 0.2s; }
  .lp-decision.good { color:var(--green); }
  .lp-decision.no   { color:var(--red); }

  /* ── REP COUNTERS (bottom nameplate area) ── */
  #reps-bar {
    position:absolute; bottom:108px; left:0; right:0;
    display:flex; justify-content:center; gap:12px; padding:0 60px;
    pointer-events:none;
  }

  .rep-card {
    flex:1; max-width:440px;
    display:flex; align-items:center; height:50px;
    background:rgba(6,6,6,0.92); border-top:1px solid var(--border);
    clip-path:inset(0 100% 0 0);
    transition:clip-path 0.5s cubic-bezier(0.77,0,0.18,1);
  }
  .rep-card.visible { clip-path:inset(0 0% 0 0); }
  .rep-card:nth-child(1){transition-delay:0s}
  .rep-card:nth-child(2){transition-delay:0.06s}
  .rep-card:nth-child(3){transition-delay:0.12s}
  .rep-card:nth-child(4){transition-delay:0.18s}

  .rc-light {
    width:4px; height:100%; flex-shrink:0;
    background:#222; transition:background 0.25s;
  }
  .rep-card.good .rc-light { background:var(--green); }
  .rep-card.no   .rc-light { background:var(--red); }

  .rc-reps { padding:0 14px; font-size:32px; font-weight:900; color:var(--gold); min-width:60px; text-align:center; line-height:1; flex-shrink:0; }
  .rc-label { font-size:8px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--dim); margin-top:2px; }

  .rc-timer { padding:0 12px; border-left:1px solid var(--border); flex-shrink:0; text-align:center; }
  .rc-timer-num { font-size:22px; font-weight:900; color:var(--text); font-variant-numeric:tabular-nums; line-height:1; }
  .rc-timer-num.warning { color:#FF8C00; }
  .rc-timer-num.danger  { color:var(--red); }
  .rc-timer-label { font-size:8px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--dim); }

  .rc-decision { flex:1; padding:0 12px; }
  .rc-decision-text { font-size:12px; font-weight:800; letter-spacing:0.18em; text-transform:uppercase; color:transparent; transition:color 0.2s; }
  .rep-card.good .rc-decision-text { color:var(--green); }
  .rep-card.no   .rc-decision-text { color:var(--red); }
</style>
</head>
<body>

<!-- Lights strip across top -->
<div id="lights-strip"></div>

<!-- Rep counters above nameplates -->
<div id="reps-bar"></div>

<script>
window.PVW_MODE = /[?&]pvw=1/.test(location.search);

if (window.PVW_MODE) {
  window.DISABLE_SSE = true;
  var _pvwReady = false;
  var _PVW_NAME = 'reps';

  window.addEventListener('message', function(e) {
    try {
      if (typeof window.onStateUpdate === 'function') {
        var keys = e.data ? Object.keys(e.data) : [];
        console.log('[' + _PVW_NAME + '] onStateUpdate received — ' + keys.length + ' keys');
        console.log('[' + _PVW_NAME + '] payload sample: ' + JSON.stringify(e.data).slice(0, 200));

        console.log('[' + _PVW_NAME + '] render begin');
        window.onStateUpdate(e.data);
        console.log('[' + _PVW_NAME + '] render end');

        (function() {
          var root = document.body;
          if (!root) { console.log('[' + _PVW_NAME + '] WARNING: document.body null'); return; }
          var rect = root.getBoundingClientRect();
          var cs   = window.getComputedStyle(root);
          console.log('[' + _PVW_NAME + '] root rect=' + Math.round(rect.width) + 'x' + Math.round(rect.height) +
                      ' visibility=' + cs.visibility + ' display=' + cs.display + ' opacity=' + cs.opacity);
          var first = root.firstElementChild;
          if (first) {
            var fr = first.getBoundingClientRect();
            console.log('[' + _PVW_NAME + '] first-child=' + first.tagName + (first.id ? '#'+first.id : '') +
                        ' rect=' + Math.round(fr.width) + 'x' + Math.round(fr.height) +
                        ' visibility=' + window.getComputedStyle(first).visibility);
          } else {
            console.log('[' + _PVW_NAME + '] WARNING: no first child in body');
          }
        }());

        if (!_pvwReady) {
          _pvwReady = true;
          requestAnimationFrame(function() {
            console.log('[' + _PVW_NAME + '] overlay-ready emitted (post-rAF paint)');
            window.parent.postMessage({ type: 'overlay-ready' }, '*');
          });
        }
      }
    } catch (err) {
      console.error('[' + _PVW_NAME + '] postMessage error:', err);
    }
  });
}
</script>
<script src="sse-client.js"></script>
<script>
let state = {
  repsVisible: false,
  lightsVisible: false,
  laneCount: 4,
  lanes: [],
};

// Build structure once per laneCount; patch content on every SSE event.
// Rebuilding innerHTML resets CSS transitions (.light-panel background, .lp-dot glow),
// causing visible flicker on every timer tick even when nothing changed.
var _builtLaneCount  = null;
var _repsWasVisible  = false;

function fmtTime(s) {
  if (s === undefined || s === null) return '—';
  return Math.floor(s/60) + ':' + String(Math.max(0,s)%60).padStart(2,'0');
}

function buildStructure(count) {
  _builtLaneCount = count;
  document.getElementById('lights-strip').innerHTML = Array.from({length:count},(_,i) => `
    <div class="light-panel" id="lp-${i}">
      <div>
        <div class="lp-lane">Lane ${i+1}</div>
        <div class="lp-name" id="lp-name-${i}"></div>
      </div>
      <div class="lp-dot" id="lp-dot-${i}"></div>
      <div class="lp-decision" id="lp-dec-${i}"></div>
    </div>`).join('');
  document.getElementById('reps-bar').innerHTML = Array.from({length:count},(_,i) => `
    <div class="rep-card" id="rc-${i}">
      <div class="rc-light"></div>
      <div style="text-align:center;padding:0 10px;flex-shrink:0">
        <div class="rc-reps" id="rc-reps-${i}">0</div>
        <div class="rc-label">Reps</div>
      </div>
      <div class="rc-timer">
        <div class="rc-timer-num" id="rc-timer-${i}">—</div>
        <div class="rc-timer-label">Time</div>
      </div>
      <div class="rc-decision">
        <div class="rc-decision-text" id="rc-dec-${i}"></div>
      </div>
    </div>`).join('');
  // Re-apply visible if cards were showing before a laneCount change
  if (_repsWasVisible) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (state.repsVisible) document.querySelectorAll('.rep-card').forEach(c => c.classList.add('visible'));
    }));
  }
}

function patchContent(count) {
  const lanes = state.lanes || [];
  for (let i = 0; i < count; i++) {
    const jd   = state['judgeL'+(i+1)] || {};
    const lane = lanes[i] || {};
    const light = jd.light || 'none';
    const lcls  = light === 'good' ? 'good' : light === 'no' ? 'no' : '';

    // Lights strip — update class + text, preserve transition-capable elements
    const lp = document.getElementById('lp-'+i);
    if (lp) {
      lp.className = 'light-panel' + (lcls ? ' '+lcls : '');
      document.getElementById('lp-name-'+i).textContent = lane.name || '';
      document.getElementById('lp-dot-'+i).className    = 'lp-dot'      + (lcls ? ' '+lcls : '');
      const dec = document.getElementById('lp-dec-'+i);
      dec.className   = 'lp-decision' + (lcls ? ' '+lcls : '');
      dec.textContent = light==='good' ? 'GOOD REP' : light==='no' ? 'NO REP' : '';
    }

    // Rep card — preserve 'visible' class, only swap light class
    const rc = document.getElementById('rc-'+i);
    if (rc) {
      const wasVis = rc.classList.contains('visible');
      rc.className = 'rep-card' + (lcls ? ' '+lcls : '') + (wasVis ? ' visible' : '');
      document.getElementById('rc-reps-'+i).textContent = jd.reps !== undefined ? jd.reps : 0;
      const rem = jd.timerRemaining;
      const timerEl = document.getElementById('rc-timer-'+i);
      timerEl.textContent = rem !== undefined ? fmtTime(rem) : '—';
      timerEl.className   = 'rc-timer-num' + ((rem!==undefined&&rem<=10)?' danger':(rem!==undefined&&rem<=20)?' warning':'');
      document.getElementById('rc-dec-'+i).textContent = light==='good' ? 'GOOD REP' : light==='no' ? 'NO REP' : '';
    }
  }
}

function render() {
  const count = Math.max(1, Math.min(4, parseInt(state.laneCount)||4));
  if (count !== _builtLaneCount) buildStructure(count);

  patchContent(count);

  // Lights strip visibility
  const strip = document.getElementById('lights-strip');
  state.lightsVisible ? strip.classList.add('visible') : strip.classList.remove('visible');

  // Rep cards — animate in on false→true, remove on true→false, skip if unchanged
  const want = !!state.repsVisible;
  if (want && !_repsWasVisible) {
    document.querySelectorAll('.rep-card').forEach(c => c.classList.remove('visible'));
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (state.repsVisible) document.querySelectorAll('.rep-card').forEach(c => c.classList.add('visible'));
    }));
    _repsWasVisible = true;
  } else if (!want && _repsWasVisible) {
    document.querySelectorAll('.rep-card').forEach(c => c.classList.remove('visible'));
    _repsWasVisible = false;
  }
}

window.onStateUpdate = function(d) { Object.assign(state, d); render(); };

// Two-phase handshake: signal runtime ready first, receive state, then emit overlay-ready after render.
if (window.PVW_MODE) {
  console.log('[reps] overlay-runtime-ready sending');
  window.parent.postMessage({ type: 'overlay-runtime-ready' }, '*');
}
</script>
</body>
</html>
